[package]
name = "fuzz-targets"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# This crate is intentionally NOT a member of the root workspace (cargo-fuzz's
# own convention): libfuzzer-sys requires nightly + ASan instrumentation
# that the normal `cargo build --workspace` toolchain in this session does
# not have. Run with `cargo +nightly fuzz run <target>` after
# `cargo install cargo-fuzz` — not exercised in this session. The
# equivalent property IS exercised today via a proptest-based "never
# panics on arbitrary bytes" test in `crates/common/src/framing.rs`,
# which runs under plain `cargo test` with no extra tooling.
#
# The other original target here, `config_bundle` (fuzzing the removed
# native-adaptive-stack `config` crate's signed-bundle parser), was
# removed along with that crate -- see docs/SUPPORTED_PRODUCT.md and
# the `archive/native-adaptive-stack-2026` branch.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
common = { path = "../crates/common" }
serde_json = "1"

[[bin]]
name = "framing_header"
path = "fuzz_targets/framing_header.rs"
test = false
doc = false
bench = false
