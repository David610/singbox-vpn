name: One-time Phase 2 documentation sync

on:
  push:
    branches:
      - chatgpt/phase2-access-paths

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/phase2-access-paths
          fetch-depth: 0
      - name: Synchronize Phase 2 implementation documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          path = 'docs/REACHABLE_FIRST_HOP_ARCHITECTURE.md'
          replace_exact(path, '**Status:** design only; no production relay has been implemented or verified.  ', '**Status:** Phase-2 access-path metadata foundation implemented; production relay/chained routing remains design-only and unverified.  ')
          replace_exact(path, 'The smallest useful additive v1 extension is an optional top-level metadata list that describes path identities without secrets:', 'The additive v1 metadata foundation now implements an optional top-level list that describes path identities without secrets:')
          replace_exact(path, '### Proposed Rust types (design only)', '### Implemented Rust metadata types')
          replace_exact(path, '`Endpoint.path` remains the reference. Do not add `relay_password`, `relay_uri`, or equivalent fields.', '`Endpoint.path` remains the reference. These Rust metadata types and their validation are now implemented. They do **not** create a relay outbound, provision a relay, or add relay credentials; those runtime mechanics remain Phase-2 follow-up work. Do not add `relay_password`, `relay_uri`, or equivalent fields.')
          replace_exact(path, 'The proposed Phase-2 MVP state would remain operator-declared. The sketch below is **design-only**, not the current `deployment.toml` / `users.json` schema:', 'The access-path metadata portion is now operator-declared and implemented in `deployment.toml` as optional `[[access_paths]]` entries. Relay credentials/references in `users.json` and actual relay runtime wiring remain **design-only**:')
          replace_exact(path, '**Stage 0 — current:** Phase-1 direct multi-endpoint failover only.  \n**Stage 1 — local mechanics:** additive path metadata + Core detour fixtures + `SIMULATED_ALLOWLIST` harness.  ', '**Stage 0 — complete locally:** Phase-1 direct multi-endpoint failover.  \n**Stage 1 — in progress:** additive non-secret access-path metadata is implemented; Core detour fixtures + `SIMULATED_ALLOWLIST` harness remain.  ')

          path = 'docs/PROVISIONING_CONTRACT.md'
          replace_exact(path, '| `path` | `direct` today. A relay path is reserved and **not implemented**; an unrecognised value round-trips like any other unknown, so a future one does not break a v1 parser. |', '| `path` | `direct` by default. When top-level `access_paths` is present, a non-direct value references an `access_paths[].id`. The metadata/reference mechanism is implemented; actual relay routing is not. |')
          marker = '**Documented limitation:** two different DNS names resolving to the same\nmachine cannot be known to share a failure domain from syntax alone, and\nwill be treated as independent. Correcting that requires the operator to\ndeclare `failure_domain` explicitly. Neither side resolves names or\nqueries ASNs to find out.\n\n'
          insertion = marker + '### Optional access-path metadata\n\n`access_paths` is an optional top-level list of **non-secret first-hop metadata**.\nIt is omitted when empty, so existing direct-only deployments keep the same\nschema-version-1 wire shape. Each entry contains only:\n\n- `id` — stable path identity referenced by a non-direct `endpoints[].path`;\n- `kind` — `direct`, `relay`, or a forward-compatible unknown value;\n- optional `failure_domain`, `region`, and `provider` operator labels;\n- non-empty `capabilities` such as `tcp`/`udp`.\n\nThe server also accepts the same metadata declaratively through optional\n`[[access_paths]]` blocks in `deployment.toml`. These declarations do not deploy,\ncontact, authenticate to, or health-check a relay. Unknown keys are refused, and\ncredential-shaped keys (`password`, `token`, `secret`, `credential`, `key`,\n`private`) fail closed. Relay credentials and protocol configuration belong only\ninside protected/opaque Core configuration, never in `access_paths`.\n\nWhen `access_paths` is non-empty, every non-direct endpoint path must resolve to\nan entry in that same atomic document. With no `access_paths` list, the original\nv1 forward-compatibility rule remains: an opaque future `path` value can still\nround-trip without being reinterpreted.\n\n**Implementation status:** this metadata and validation layer is implemented and\ntested. A production relay outbound, Core `detour` chain, relay credential\nlifecycle, and real-network reachability are not implemented or verified by this\ncontract change.\n\n'
          replace_exact(path, marker, insertion)
          old_bullet = '* `singbox_config` — the Core-consumable config for exactly the endpoint\n  set above, rendered from the same model in the same request. See **The\n  additive `schema_version` 1 extension**.\n'
          new_bullet = '* `access_paths` — optional non-secret first-hop metadata. Omitted when empty; when present, non-direct `endpoints[].path` values must resolve to an id in this list. It contains no relay credentials or proxy configuration.\n' + old_bullet
          replace_exact(path, old_bullet, new_bullet)

          path = 'docs/IMPLEMENTATION_STATUS.md'
          intro = 'Read `docs/SUPPORTED_PRODUCT.md` first; do not re-audit the repo from scratch.\n\n'
          update = intro + '## Phase-2 access-path metadata update (2026-09-10)\n\n- Optional, non-secret `access_paths` metadata is now implemented in the\n  schema-version-1 provisioning contract and in `deployment.toml` as\n  `[[access_paths]]`. Empty/absent access paths preserve the previous direct-only\n  wire/deployment behavior.\n- Non-direct endpoint `path` values resolve against the declared access-path set\n  once a document opts into that list. Duplicate/dangling ids, empty capability\n  sets, and credential-shaped/unknown deployment keys fail closed.\n- The subscription service carries the declared metadata into the same atomic\n  provisioning document as the endpoint catalog and embedded Core config.\n- Targeted Rust tests cover round-trip, zero-path compatibility, secret-shaped\n  key rejection, duplicate/dangling references, and legacy opaque-path behavior.\n- **Not implemented by this checkpoint:** a real relay outbound, Core `detour`\n  chain, per-user relay credential lifecycle, Tamara `(exit, access-path)` route\n  selection, or the `SIMULATED_ALLOWLIST` harness. No real VPS/restricted-network\n  evidence is claimed.\n\n'
          replace_exact(path, intro, update)

          path = 'docs/CLIENT_PROTOCOL_BEHAVIOR.md'
          replace_exact(path, '| **PRIMARY, first-party** | `singbox-client` (<https://github.com/David610/singbox-client>) | The versioned provisioning contract, `GET /v1/provision/{token}` — `docs/PROVISIONING_CONTRACT.md`. |', '| **PRIMARY, first-party** | **Tamara** (<https://github.com/David610/tamara>) | The versioned provisioning contract, `GET /v1/provision/{token}` — `docs/PROVISIONING_CONTRACT.md`. |')
          old = "Both tiers are rendered from the same endpoint model\n(`crates/compat-config/src/contract.rs`), so they can never disagree\nabout a user's credentials. The division of responsibility in the table\nbelow is identical for both: the contract is deliberately narrower than\nthe sing-box profile — it carries no routing or selector semantics at\nall, because those are the client's to decide."
          new = "Both tiers are rendered from the same endpoint model\n(`crates/compat-config/src/contract.rs`), so they can never disagree\nabout a user's credentials. Tamara receives the versioned envelope plus\nan opaque Core-consumable `singbox_config`; Tamara owns runtime route\nselection policy and does not reimplement transport parsing. Fallback\nclients keep consuming the legacy representations. Server metadata may\ndescribe selectable routes, but client-owned TUN/DNS/lifecycle policy\nremains outside this contract."
          replace_exact(path, old, new)

          path = 'docs/CLIENT_COMPATIBILITY.md'
          old = '**Client tiers.** `singbox-client`\n(<https://github.com/David610/singbox-client>) is the PRIMARY,\nfirst-party client and consumes the versioned provisioning contract\n(`docs/PROVISIONING_CONTRACT.md`). Hiddify and the other importers below\nare FALLBACK, third-party consumers of the legacy `/sub/` formats. The\ntier does not change the honesty rule: no row below is "yes" on the\nstrength of the contract existing. `singbox-client` has no row here at\nall yet — its own device testing lives in its repository, and this\nproject claims nothing about it beyond the contract shape its CI can\ncheck against `fixtures/singbox-client-contract/`.\n'
          new = '**Client tiers.** **Tamara** (<https://github.com/David610/tamara>) is the\nPRIMARY, first-party client and consumes the versioned provisioning contract\n(`docs/PROVISIONING_CONTRACT.md`). Hiddify and the other importers below are\nFALLBACK, third-party consumers of the legacy `/sub/` formats. The tier does not\nchange the honesty rule: no row below is "yes" on the strength of the contract\nexisting. The historical `singbox-client` fixture directory is retained only to\navoid churn in fixture consumers; `singbox-client` itself is superseded and is\nnot a product source of truth.\n'
          replace_exact(path, old, new)

          path = 'crates/provisioning-contract/src/lib.rs'
          replace_exact(path, '//! The versioned, first-party provisioning contract between this server\n//! (`singbox-vpn`) and its primary client, `singbox-client`\n//! (<https://github.com/David610/singbox-client>).', '//! The versioned, first-party provisioning contract between this server\n//! (`singbox-vpn`) and its primary client, Tamara\n//! (<https://github.com/David610/tamara>).')
          replace_exact(path, '/// Oldest `singbox-client` release able to parse `schema_version = 1`.', '/// Minimum client version advertised by schema-version-1 documents.')
          old = '/// Only [`PathType::Direct`] is produced today. A relay path is reserved\n/// and NOT implemented; [`PathType::Other`] exists so a document written\n/// by a future server that does implement one round-trips through a\n/// consumer written today rather than failing its parse, exactly like\n/// [`Capability::Other`] and [`Transport::Other`].'
          new = '/// [`PathType::Direct`] is the default. When a document carries the additive\n/// `access_paths` list, [`PathType::Other`] may name one of those non-secret\n/// path identities. The metadata/reference layer is implemented; actual relay\n/// transport configuration remains inside Core and is not implemented here.'
          replace_exact(path, old, new)
          PY

          cargo fmt --all -- --check
          git diff --check
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/REACHABLE_FIRST_HOP_ARCHITECTURE.md \
            docs/PROVISIONING_CONTRACT.md \
            docs/IMPLEMENTATION_STATUS.md \
            docs/CLIENT_PROTOCOL_BEHAVIOR.md \
            docs/CLIENT_COMPATIBILITY.md \
            crates/provisioning-contract/src/lib.rs
          git diff --cached --check
          git commit -m "docs: synchronize Phase 2 access-path status"
          git push origin HEAD:chatgpt/phase2-access-paths
