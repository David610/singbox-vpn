name: assistant phase1 relay core

on:
  push:
    branches:
      - feat/relay-hardening-live-vps
    paths:
      - .github/assistant/apply_phase1.py
      - .github/workflows/assistant-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/relay-hardening-live-vps
          fetch-depth: 0
      - name: Apply edits
        run: python3 .github/assistant/apply_phase1.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test relay and schema packages
        run: |
          cargo test -p provisioning-contract
          cargo test -p compat-config
          cargo test -p subscription
      - name: Commit applied changes
        run: |
          rm -f .github/assistant/apply_phase1.py .github/workflows/assistant-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement native relay detour core and node schema"
          git push origin HEAD:feat/relay-hardening-live-vps
