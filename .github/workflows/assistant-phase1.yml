name: assistant phase1 relay core

on:
  push:
    branches:
      - feat/relay-hardening-live-vps
    paths:
      - .github/assistant/apply_phase1.py
      - .github/workflows/assistant-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/relay-hardening-live-vps
          fetch-depth: 0
      - name: Repair patch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/assistant/apply_phase1.py')
          s = p.read_text()
          needle = '''def replace_once(path, old, new):\n    text = read(path)\n    n = text.count(old)\n    if n != 1:\n        raise SystemExit(f"{path}: expected exactly one match, found {n} for:\\n{old[:300]}")\n    write(path, text.replace(old, new, 1))\n'''
          replacement = needle + '''\ndef replace_first(path, old, new):\n    text = read(path)\n    n = text.count(old)\n    if n < 1:\n        raise SystemExit(f"{path}: expected at least one match for:\\n{old[:300]}")\n    write(path, text.replace(old, new, 1))\n'''
          if needle not in s:
              raise SystemExit('replace_once helper shape changed')
          s = s.replace(needle, replacement, 1)
          target = '''replace_once(path,\n''' + "'''    pub fn with_metadata(\n        mut self,\n        failure_domain: Option<String>,'''"
          if target not in s:
              raise SystemExit('ambiguous with_metadata call not found')
          s = s.replace(target, target.replace('replace_once', 'replace_first', 1), 1)

          start_marker = '# URI/share-link syntax has no detour.'
          end_marker = '# ---------------------------------------------------------------------------\n# A deterministic relay rendering integration test'
          a = s.find(start_marker)
          b = s.find(end_marker, a)
          if a < 0 or b < 0:
              raise SystemExit('URI patch source block not found')
          fixed = '''# URI/share-link syntax has no detour. Never misrepresent a relayed route as\n# direct; the first-party/Core config remains the supported relay surface.\npath = "crates/compat-config/src/render.rs"\nfor fn_name in ("render_uri_list", "render_vision_off_uri_list"):\n    text = read(path)\n    marker = f"pub fn {fn_name}("\n    start = text.index(marker)\n    loop = text.index("    for ep in endpoints {", start)\n    guard = ''' + '"""' + '''    for ep in endpoints {\n        if ep.path.as_deref().is_some_and(|path| path != "direct") {\n            // Share-link syntax cannot express sing-box detour. Omitting the\n            // route is safer than silently handing a client a direct exit.\n            continue;\n        }\n''' + '"""' + '''\n    text = text[:loop] + guard + text[loop + len("    for ep in endpoints {\\n"):]\n    write(path, text)\n\n'''
          s = s[:a] + fixed + s[b:]
          p.write_text(s)
          PY
      - name: Apply edits
        run: python3 .github/assistant/apply_phase1.py
      - name: Complete compatibility fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'crates/compat-config/src/model.rs': (
                  '''            asn: None,\n            path: None,\n        }\n    }\n}''',
                  '''            asn: None,\n            path: None,\n            credential_ref: None,\n        }\n    }\n}''',
              ),
              'apps/admin/src/main.rs': (
                  '''            asn: None,\n            path: "direct".into(),\n            extra: Default::default(),''',
                  '''            asn: None,\n            path: "direct".into(),\n            credential_ref: None,\n            extra: Default::default(),''',
              ),
              'crates/compat-config/tests/contract_fixtures.rs': (
                  '''        asn: Some("operator-label-b".into()),\n        path: Some("direct".into()),\n    }\n}''',
                  '''        asn: Some("operator-label-b".into()),\n        path: Some("direct".into()),\n        credential_ref: None,\n    }\n}''',
              ),
              'services/subscription/src/lib.rs': (
                  '''            asn: None,\n            path: Some("direct".into()),\n        });''',
                  '''            asn: None,\n            path: Some("direct".into()),\n            credential_ref: None,\n        });''',
              ),
              'crates/compat-config/src/deployment.rs': (
                  '''            "schema_version = {DEPLOYMENT_SCHEMA_VERSION}\\n{}",\n            legacy_toml()''',
                  '''            "schema_version = {DEPLOYMENT_SCHEMA_VERSION}\\nnode_id = \\\"test-node\\\"\\nrole = \\\"exit\\\"\\n{}",\n            legacy_toml()''',
              ),
          }
          for name, (old, new) in replacements.items():
              p = Path(name)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one targeted compatibility fixture, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Finish relay profile integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Shape-valid, deliberately synthetic X25519 test key.
          p = Path('crates/compat-config/tests/relay_detour.rs')
          s = p.read_text()
          for old in (
              'FAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEfake',
              'RURUFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEfake',
          ):
              s = s.replace(old, 'AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8')
          p.write_text(s)

          # Add an options-aware access-path provisioning entry point so the
          # relay path preserves both selection profile and compatibility mode
          # (including quic-reject). Existing wrappers retain their old defaults.
          p = Path('crates/compat-config/src/contract.rs')
          s = p.read_text()
          old = '''pub fn provisioning_document_with_mode_and_access_paths(\n    user: &CompatUser,\n    endpoints: &[CompatEndpoint],\n    mode: DiagnosticMode,\n    access_paths: &[contract::AccessPath],\n) -> Result<contract::ProvisioningDocument, CompatError> {\n    let mut contract_endpoints = Vec::with_capacity(endpoints.len());'''
          new = '''pub fn provisioning_document_with_mode_and_access_paths(\n    user: &CompatUser,\n    endpoints: &[CompatEndpoint],\n    mode: DiagnosticMode,\n    access_paths: &[contract::AccessPath],\n) -> Result<contract::ProvisioningDocument, CompatError> {\n    let compat_mode = match mode {\n        DiagnosticMode::TcpOnly => crate::render::CompatibilityMode::TcpOnly,\n        DiagnosticMode::VisionOff => crate::render::CompatibilityMode::VisionOff,\n        DiagnosticMode::None => crate::render::CompatibilityMode::Normal,\n    };\n    provisioning_document_with_mode_and_access_paths_and_options(\n        user,\n        endpoints,\n        mode,\n        access_paths,\n        crate::render::SelectionProfile::default(),\n        compat_mode,\n    )\n}\n\n/// Access-path-aware provisioning while preserving the caller's complete\n/// rendering request. This is used by relay-aware subscriptions.\npub fn provisioning_document_with_mode_and_access_paths_and_options(\n    user: &CompatUser,\n    endpoints: &[CompatEndpoint],\n    mode: DiagnosticMode,\n    access_paths: &[contract::AccessPath],\n    profile: crate::render::SelectionProfile,\n    compat_mode: crate::render::CompatibilityMode,\n) -> Result<contract::ProvisioningDocument, CompatError> {\n    let mut contract_endpoints = Vec::with_capacity(endpoints.len());'''
          if s.count(old) != 1:
              raise SystemExit('access-path provisioning function shape changed')
          s = s.replace(old, new, 1)
          old = '''        access_paths,\n        crate::render::SelectionProfile::default(),\n        match mode {\n            DiagnosticMode::TcpOnly => crate::render::CompatibilityMode::TcpOnly,\n            DiagnosticMode::VisionOff | DiagnosticMode::None => {\n                crate::render::CompatibilityMode::Normal\n            }\n        },\n    )?;'''
          new = '''        access_paths,\n        profile,\n        compat_mode,\n    )?;'''
          if s.count(old) != 1:
              raise SystemExit('access-path renderer option block changed')
          p.write_text(s.replace(old, new, 1))

          # Preserve legacy /sub output byte-for-byte when the deployment has
          # no access paths. Only relay-aware deployments use the new document
          # path; this avoids regressing existing single-node subscriptions.
          p = Path('services/subscription/src/lib.rs')
          s = p.read_text()
          start_marker = '''        "singbox" => {\n            let mode = match compat_mode {'''
          start = s.find(start_marker)
          end_marker = '''        ,\n        "uri" | "hiddify" => {'''
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('generated singbox subscription branch not found')
          replacement = '''        "singbox" => {\n            if state.access_paths.is_empty() {\n                match render::render_singbox_client_subscription_with_options(\n                    &user,\n                    &state.endpoints,\n                    profile,\n                    compat_mode,\n                ) {\n                    Ok(doc) => match serde_json::to_string_pretty(&doc) {\n                        Ok(body) => (StatusCode::OK, [("content-type", "application/json")], body).into_response(),\n                        Err(e) => {\n                            tracing::error!(error = %e, "failed to serialize singbox subscription");\n                            (StatusCode::INTERNAL_SERVER_ERROR, "render error").into_response()\n                        }\n                    },\n                    Err(e) => {\n                        tracing::error!(error = %e, "failed to render singbox subscription");\n                        (StatusCode::INTERNAL_SERVER_ERROR, "render error").into_response()\n                    }\n                }\n            } else {\n                let mode = match compat_mode {\n                    render::CompatibilityMode::TcpOnly => compat_config::contract::DiagnosticMode::TcpOnly,\n                    render::CompatibilityMode::VisionOff => compat_config::contract::DiagnosticMode::VisionOff,\n                    _ => compat_config::contract::DiagnosticMode::None,\n                };\n                match compat_config::contract::provisioning_document_with_mode_and_access_paths_and_options(\n                    &user,\n                    &state.endpoints,\n                    mode,\n                    &state.access_paths,\n                    profile,\n                    compat_mode,\n                ) {\n                    Ok(doc) => match doc.singbox_config {\n                        Some(config) => match serde_json::to_string_pretty(&config) {\n                            Ok(body) => (StatusCode::OK, [("content-type", "application/json")], body).into_response(),\n                            Err(e) => {\n                                tracing::error!(error = %e, "failed to serialize relay-aware singbox subscription");\n                                (StatusCode::INTERNAL_SERVER_ERROR, "render error").into_response()\n                            }\n                        },\n                        None => (StatusCode::INTERNAL_SERVER_ERROR, "render error").into_response(),\n                    },\n                    Err(e) => {\n                        tracing::error!(error = %e, "failed to render relay-aware singbox subscription");\n                        (StatusCode::INTERNAL_SERVER_ERROR, "render error").into_response()\n                    }\n                }\n            }\n        }'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test relay and schema packages
        run: |
          cargo test -p provisioning-contract
          cargo test -p compat-config
          cargo test -p subscription
      - name: Commit applied changes
        run: |
          rm -f .github/assistant/apply_phase1.py .github/workflows/assistant-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement native relay detour core and node schema"
          git push origin HEAD:feat/relay-hardening-live-vps