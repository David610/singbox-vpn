name: assistant phase1 relay core

on:
  push:
    branches:
      - feat/relay-hardening-live-vps
    paths:
      - .github/assistant/apply_phase1.py
      - .github/workflows/assistant-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/relay-hardening-live-vps
          fetch-depth: 0
      - name: Repair patch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/assistant/apply_phase1.py')
          s = p.read_text()
          needle = '''def replace_once(path, old, new):\n    text = read(path)\n    n = text.count(old)\n    if n != 1:\n        raise SystemExit(f"{path}: expected exactly one match, found {n} for:\\n{old[:300]}")\n    write(path, text.replace(old, new, 1))\n'''
          replacement = needle + '''\ndef replace_first(path, old, new):\n    text = read(path)\n    n = text.count(old)\n    if n < 1:\n        raise SystemExit(f"{path}: expected at least one match for:\\n{old[:300]}")\n    write(path, text.replace(old, new, 1))\n'''
          if needle not in s:
              raise SystemExit('replace_once helper shape changed')
          s = s.replace(needle, replacement, 1)
          target = '''replace_once(path,\n''' + "'''    pub fn with_metadata(\n        mut self,\n        failure_domain: Option<String>,'''"
          if target not in s:
              raise SystemExit('ambiguous with_metadata call not found')
          s = s.replace(target, target.replace('replace_once', 'replace_first', 1), 1)

          start_marker = '# URI/share-link syntax has no detour.'
          end_marker = '# ---------------------------------------------------------------------------\n# A deterministic relay rendering integration test'
          a = s.find(start_marker)
          b = s.find(end_marker, a)
          if a < 0 or b < 0:
              raise SystemExit('URI patch source block not found')
          fixed = '''# URI/share-link syntax has no detour. Never misrepresent a relayed route as\n# direct; the first-party/Core config remains the supported relay surface.\npath = "crates/compat-config/src/render.rs"\nfor fn_name in ("render_uri_list", "render_vision_off_uri_list"):\n    text = read(path)\n    marker = f"pub fn {fn_name}("\n    start = text.index(marker)\n    loop = text.index("    for ep in endpoints {", start)\n    guard = ''' + '"""' + '''    for ep in endpoints {\n        if ep.path.as_deref().is_some_and(|path| path != "direct") {\n            // Share-link syntax cannot express sing-box detour. Omitting the\n            // route is safer than silently handing a client a direct exit.\n            continue;\n        }\n''' + '"""' + '''\n    text = text[:loop] + guard + text[loop + len("    for ep in endpoints {\\n"):]\n    write(path, text)\n\n'''
          s = s[:a] + fixed + s[b:]
          p.write_text(s)
          PY
      - name: Apply edits
        run: python3 .github/assistant/apply_phase1.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test relay and schema packages
        run: |
          cargo test -p provisioning-contract
          cargo test -p compat-config
          cargo test -p subscription
      - name: Commit applied changes
        run: |
          rm -f .github/assistant/apply_phase1.py .github/workflows/assistant-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement native relay detour core and node schema"
          git push origin HEAD:feat/relay-hardening-live-vps
