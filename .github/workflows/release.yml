name: Release

# Builds prebuilt singbox-vpn binaries (vpn-admin, subscription) so
# deploy/almalinux/install.sh (and the root install.sh bootstrap) can
# install a production VPS without a Rust toolchain. Triggered on
# `v*` tags; each tag produces one GitHub Release with per-arch tarballs
# plus a SHA256SUMS file the installer verifies before using anything.
#
# The stable bootstrap refuses to install when no release exists. For an
# existing exact tag, the AlmaLinux installer prefers these prebuilt assets
# and can build from that same checksum-verified tag source only when its
# architecture-specific binary asset is unavailable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.1)"
        required: true

env:
  CARGO_TERM_COLOR: always

# Default every release job to read-only. Build narrows in OIDC/attestation
# writes; publish narrows in contents:write. No other job receives write scope.
permissions:
  contents: read

jobs:
  # Checkpoint 6 §8: a manual workflow_dispatch run must build the exact
  # tagged commit it claims to publish, never whatever ref happened to
  # trigger the run. `actions/checkout@v4` with no explicit `ref:` checks
  # out `github.sha`, which for workflow_dispatch is whichever branch/tag
  # the operator selected in the "Use workflow from" dropdown — NOT
  # necessarily the tag named in the `tag` input. Refuse to proceed unless
  # they match, instead of silently building/publishing a mismatch.
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm tag push ref
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::release push was not a tag ref: ${{ github.ref }}"
            exit 1
          fi
          echo "ok: release triggered by tag ${{ github.ref_name }}"

      - name: Confirm dispatch ref is the requested tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ] || [ "${{ github.ref_name }}" != "${{ github.event.inputs.tag }}" ]; then
            echo "::error::workflow_dispatch was run from ref '${{ github.ref_name }}' (type: ${{ github.ref_type }}), but the 'tag' input requested '${{ github.event.inputs.tag }}'. Re-run this workflow using the 'Use workflow from' dropdown set to the '${{ github.event.inputs.tag }}' tag itself, so the built commit and the published tag are guaranteed to match."
            exit 1
          fi
          echo "ok: dispatched from tag ${{ github.ref_name }}, matches requested tag ${{ github.event.inputs.tag }}"

  validate-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm release tag matches packaged Rust versions
        run: bash deploy/lib/check-release-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

  # Checkpoint 6 §9: a release must not be publishable merely because
  # binaries compiled — it must pass the same gate as every other change
  # (fmt, clippy, workspace tests, shellcheck, cargo audit, secret-logging,
  # release archive contract, real pinned sing-box interop). Reusing
  # ci.yml as a reusable workflow (workflow_call) keeps this as one
  # canonical job graph instead of a second, driftable copy.
  gate:
    needs: [validate-tag, validate-version]
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.validate-version.result == 'success' }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Keep this exact revision aligned with rust-toolchain.toml. The action
      # installs matrix targets for the selected toolchain; using @stable here
      # would install aarch64 for a different toolchain when the repository pin
      # overrides rustup's active version.
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p admin -p subscription

      - name: Package
        run: |
          set -euo pipefail
          out="singbox-vpn-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/vpn-admin" "$out/vpn-admin"
          cp "target/${{ matrix.target }}/release/subscription" "$out/subscription"
          cp README.md LICENSE "$out/"
          tar -czf "${out}.tar.gz" "$out"
          sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256"

      - name: Attest binary archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: singbox-vpn-${{ matrix.target }}.tar.gz

      # Archive/installer contract test (docs/FINAL_PRODUCTION_AUDIT.md
      # P0-6): extract the archive we JUST built using the exact same
      # relative-path assumptions deploy/almalinux/install.sh's
      # fetch_release_binaries() uses, and fail the release build if they
      # have ever drifted apart — this is the one place both "descriptions"
      # of the archive format (this workflow, and the installer) are
      # checked against each other automatically instead of by hand.
      - name: Archive/installer contract test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf "singbox-vpn-${{ matrix.target }}.tar.gz" -C "$tmp"
          extracted="$tmp/singbox-vpn-${{ matrix.target }}"
          test -d "$extracted" || { echo "::error::archive did not contain singbox-vpn-${{ matrix.target }}/ — install.sh's fetch_release_binaries() expects exactly this layout"; exit 1; }
          test -x "$extracted/vpn-admin" || { echo "::error::vpn-admin missing or not executable in archive"; exit 1; }
          test -x "$extracted/subscription" || { echo "::error::subscription missing or not executable in archive"; exit 1; }
          test -f "$extracted/LICENSE" || { echo "::error::LICENSE missing from release archive"; exit 1; }
          if [ "${{ matrix.target }}" = "$(uname -m)-unknown-linux-gnu" ]; then
            "$extracted/vpn-admin" --version
            "$extracted/subscription" --version
          else
            echo "skipping --version execution: ${{ matrix.target }} is cross-compiled, cannot run on $(uname -m) runner"
          fi
          rm -rf "$tmp"
          echo "archive/installer contract OK: layout matches deploy/almalinux/install.sh's fetch_release_binaries()"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: singbox-vpn-${{ matrix.target }}
          path: |
            singbox-vpn-${{ matrix.target }}.tar.gz
            singbox-vpn-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

      # Checksum-verified source payload (docs re: install.sh's bootstrap
      # release-integrity gap): the top-level install.sh bootstrap
      # downloads a source archive before it has any prebuilt binary to
      # check — an unauthenticated `codeload.github.com` tag tarball is
      # not itself a verified release artifact. Built once here (one
      # matrix leg only, content doesn't depend on target arch) so the
      # bootstrap has a checksum-manifested asset to verify against for
      # any pinned SINGBOX_VPN_VERSION install.
      - name: Package source archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=singbox-vpn-src/ -o singbox-vpn-src.tar.gz HEAD
          sha256sum singbox-vpn-src.tar.gz > singbox-vpn-src.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf singbox-vpn-src.tar.gz -C "$tmp"
          test -x "$tmp/singbox-vpn-src/deploy/almalinux/install.sh" || {
            echo "::error::source archive cannot hand off to executable deploy/almalinux/install.sh"
            exit 1
          }
          rm -rf "$tmp"

      - name: Attest source archive provenance
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: singbox-vpn-src.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: singbox-vpn-src
          path: |
            singbox-vpn-src.tar.gz
            singbox-vpn-src.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Build combined checksum file
        run: |
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # GitHub's "latest release" resolution (which install.sh's
          # resolve_version() queries via /releases/latest) skips any
          # release marked prerelease. A tag containing a SemVer
          # prerelease segment (e.g. v0.1.1-rc.1) is marked as such here
          # so a release candidate can never be silently auto-installed by
          # a normal stable `curl | sudo bash` run — only an explicit
          # `--version v0.1.1-rc.1` pin resolves it (Checkpoint 6 §19).
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

  # Exercise the public assets after GitHub has published them. The fake
  # final handoff keeps this read-only while still running the real bootstrap
  # through release resolution, checksum verification, extraction, and the
  # deploy/almalinux/install.sh boundary that broke in v0.1.0.
  verify-published-bootstrap:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify published release through the real bootstrap
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          testbin="$(mktemp -d)"
          marker="$(mktemp)"
          trap 'rm -rf "$testbin" "$marker"' EXIT

          cat > "$testbin/id" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "-u" ]; then
            printf '0\n'
            exit 0
          fi
          exec /usr/bin/id "$@"
          EOF

          cat > "$testbin/bash" <<'EOF'
          #!/bin/sh
          set -eu
          installer="${1:-}"
          [ -n "$installer" ] || { echo "missing installer handoff path" >&2; exit 1; }
          shift
          [ -x "$installer" ] || { echo "handoff target is not executable: $installer" >&2; exit 1; }
          case "$installer" in
            */deploy/almalinux/install.sh) ;;
            *) echo "unexpected handoff target: $installer" >&2; exit 1 ;;
          esac
          [ "${SINGBOX_VPN_VERSION:-}" = "${RELEASE_TAG:?}" ] || {
            echo "bootstrap handed off SINGBOX_VPN_VERSION='${SINGBOX_VPN_VERSION:-}', expected '$RELEASE_TAG'" >&2
            exit 1
          }
          printf '%s\n' "$*" > "${SINGBOX_VPN_BOOTSTRAP_VERIFY_MARKER:?}"
          EOF

          chmod +x "$testbin/id" "$testbin/bash"
          export SINGBOX_VPN_BOOTSTRAP_VERIFY_MARKER="$marker"
          PATH="$testbin:$PATH" /usr/bin/bash install.sh \
            --version "$RELEASE_TAG" \
            --non-interactive \
            --allow-ip-hostname \
            --reality-handshake-server www.cloudflare.com

          grep -Fxq -- '--non-interactive --allow-ip-hostname --reality-handshake-server www.cloudflare.com' "$marker"
          echo "published bootstrap verified for $RELEASE_TAG"
