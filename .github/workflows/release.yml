name: Release

# Builds prebuilt vpn1 binaries (vpn-admin, subscription) so
# deploy/almalinux/install.sh (and the root install.sh bootstrap) can
# install a production VPS without a Rust toolchain. Triggered on
# `v*` tags; each tag produces one GitHub Release with per-arch tarballs
# plus a SHA256SUMS file the installer verifies before using anything.
#
# The installer falls back to `cargo build --release` from source when
# no matching release exists (e.g. before the first tag is ever pushed,
# or for untagged main-branch installs) — this workflow is what removes
# that fallback from the common path going forward.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Checkpoint 6 §8: a manual workflow_dispatch run must build the exact
  # tagged commit it claims to publish, never whatever ref happened to
  # trigger the run. `actions/checkout@v4` with no explicit `ref:` checks
  # out `github.sha`, which for workflow_dispatch is whichever branch/tag
  # the operator selected in the "Use workflow from" dropdown — NOT
  # necessarily the tag named in the `tag` input. Refuse to proceed unless
  # they match, instead of silently building/publishing a mismatch.
  validate-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm dispatch ref is the requested tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ] || [ "${{ github.ref_name }}" != "${{ github.event.inputs.tag }}" ]; then
            echo "::error::workflow_dispatch was run from ref '${{ github.ref_name }}' (type: ${{ github.ref_type }}), but the 'tag' input requested '${{ github.event.inputs.tag }}'. Re-run this workflow using the 'Use workflow from' dropdown set to the '${{ github.event.inputs.tag }}' tag itself, so the built commit and the published tag are guaranteed to match."
            exit 1
          fi
          echo "ok: dispatched from tag ${{ github.ref_name }}, matches requested tag ${{ github.event.inputs.tag }}"

  # Checkpoint 6 §9: a release must not be publishable merely because
  # binaries compiled — it must pass the same gate as every other change
  # (fmt, clippy, workspace tests, shellcheck, cargo audit, secret-logging,
  # release archive contract, real pinned sing-box interop). Reusing
  # ci.yml as a reusable workflow (workflow_call) keeps this as one
  # canonical job graph instead of a second, driftable copy.
  gate:
    needs: [validate-tag]
    if: always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped')
    uses: ./.github/workflows/ci.yml

  build:
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p admin -p subscription

      - name: Package
        run: |
          set -euo pipefail
          out="vpn1-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/vpn-admin" "$out/vpn-admin"
          cp "target/${{ matrix.target }}/release/subscription" "$out/subscription"
          cp README.md LICENSE "$out/"
          tar -czf "${out}.tar.gz" "$out"
          sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256"

      # Archive/installer contract test (docs/FINAL_PRODUCTION_AUDIT.md
      # P0-6): extract the archive we JUST built using the exact same
      # relative-path assumptions deploy/almalinux/install.sh's
      # fetch_release_binaries() uses, and fail the release build if they
      # have ever drifted apart — this is the one place both "descriptions"
      # of the archive format (this workflow, and the installer) are
      # checked against each other automatically instead of by hand.
      - name: Archive/installer contract test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf "vpn1-${{ matrix.target }}.tar.gz" -C "$tmp"
          extracted="$tmp/vpn1-${{ matrix.target }}"
          test -d "$extracted" || { echo "::error::archive did not contain vpn1-${{ matrix.target }}/ — install.sh's fetch_release_binaries() expects exactly this layout"; exit 1; }
          test -x "$extracted/vpn-admin" || { echo "::error::vpn-admin missing or not executable in archive"; exit 1; }
          test -x "$extracted/subscription" || { echo "::error::subscription missing or not executable in archive"; exit 1; }
          test -f "$extracted/LICENSE" || { echo "::error::LICENSE missing from release archive"; exit 1; }
          if [ "${{ matrix.target }}" = "$(uname -m)-unknown-linux-gnu" ]; then
            "$extracted/vpn-admin" --version
            "$extracted/subscription" --version
          else
            echo "skipping --version execution: ${{ matrix.target }} is cross-compiled, cannot run on $(uname -m) runner"
          fi
          rm -rf "$tmp"
          echo "archive/installer contract OK: layout matches deploy/almalinux/install.sh's fetch_release_binaries()"

      - uses: actions/upload-artifact@v4
        with:
          name: vpn1-${{ matrix.target }}
          path: |
            vpn1-${{ matrix.target }}.tar.gz
            vpn1-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

      # Checksum-verified source payload (docs re: install.sh's bootstrap
      # release-integrity gap): the top-level install.sh bootstrap
      # downloads a source archive before it has any prebuilt binary to
      # check — an unauthenticated `codeload.github.com` tag tarball is
      # not itself a verified release artifact. Built once here (one
      # matrix leg only, content doesn't depend on target arch) so the
      # bootstrap has a checksum-manifested asset to verify against for
      # any pinned VPN1_VERSION install.
      - name: Package source archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=vpn1-src/ -o vpn1-src.tar.gz HEAD
          sha256sum vpn1-src.tar.gz > vpn1-src.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: vpn1-src
          path: |
            vpn1-src.tar.gz
            vpn1-src.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build combined checksum file
        run: |
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # GitHub's "latest release" resolution (which install.sh's
          # resolve_version() queries via /releases/latest) skips any
          # release marked prerelease. A tag containing a SemVer
          # prerelease segment (e.g. v1.0.0-rc.1) is marked as such here
          # so a release candidate can never be silently auto-installed by
          # a normal stable `curl | sudo bash` run — only an explicit
          # `--version v1.0.0-rc.1` pin resolves it (Checkpoint 6 §19).
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
