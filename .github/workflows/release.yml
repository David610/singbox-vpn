name: Release

# Builds prebuilt singbox-vpn binaries (vpn-admin, subscription) so
# deploy/almalinux/install.sh (and the root install.sh bootstrap) can
# install a production VPS without a Rust toolchain.
#
# Prerelease tags (for example v1.0.0-rc.1) may publish automatically after
# the canonical CI gate. Stable tags never auto-publish: they require an
# explicit workflow_dispatch from the exact stable tag plus the acceptance
# record defined in docs/RELEASE.md.

on:
  push:
    # Only prerelease tags auto-publish. A stable vX.Y.Z tag is intentionally
    # excluded and must be released through workflow_dispatch after the real
    # VPS/device acceptance evidence is committed.
    tags: ["v*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact tag to build and publish (e.g. v1.0.0-rc.1 or v1.0.0)"
        required: true
      confirm_stable_release:
        description: "Required for a stable vX.Y.Z release after RC/VPS/device acceptance"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  # RELEASE_BUILD_IMAGE / RELEASE_GLIBC_BASELINE (the pinned AlmaLinux
  # 8.10 build container and its declared GLIBC ABI baseline) live in
  # deploy/lib/release-build.env, not here — that file is the single
  # source both this workflow's "build" job and ci.yml's cheap pre-tag
  # "release-container-smoke" job load, so the two can never drift. See
  # that file's header for the v1.0.0-rc.3/rc.4 incident history.

# Default every release job to read-only. Build narrows in OIDC/attestation
# writes; publish narrows in contents:write. No other job receives write scope.
permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm tag push ref
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::release push was not a tag ref: ${{ github.ref }}"
            exit 1
          fi
          case "$RELEASE_TAG" in
            *-*) ;;
            *)
              echo "::error::stable tags must not auto-publish. Run this workflow manually from the exact stable tag after completing docs/RELEASE.md."
              exit 1 ;;
          esac
          echo "ok: prerelease triggered by tag $RELEASE_TAG"

      - name: Confirm dispatch ref is the requested tag
        if: github.event_name == 'workflow_dispatch'
        # Contract: github.ref_name must equal github.event.inputs.tag. The
        # values are routed through env rather than interpolated into shell
        # code so a tag/input can never become script text.
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$REQUESTED_TAG" ]; then
            echo "::error::workflow_dispatch was run from ref '$REF_NAME' (type: $REF_TYPE), but the tag input requested '$REQUESTED_TAG'. Re-run using 'Use workflow from' set to the exact '$REQUESTED_TAG' tag."
            exit 1
          fi
          echo "ok: dispatched from exact tag $REF_NAME"

  validate-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm release tag matches packaged Rust versions
        run: bash deploy/lib/check-release-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

  validate-release-policy:
    needs: [validate-tag, validate-version]
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.validate-version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce stable RC acceptance policy
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_STABLE_RELEASE: ${{ github.event.inputs.confirm_stable_release || 'false' }}
        run: |
          set -euo pipefail

          # Prereleases are intentionally allowed through after tag/version
          # validation and the canonical CI graph below. Stable releases have
          # the stronger evidence gate.
          case "$RELEASE_TAG" in
            *-*)
              echo "ok: $RELEASE_TAG is a prerelease; stable acceptance record is not required yet."
              exit 0 ;;
          esac

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::stable releases are manual-only. Use workflow_dispatch from the exact stable tag."
            exit 1
          fi
          if [ "$CONFIRM_STABLE_RELEASE" != "true" ]; then
            echo "::error::stable release requires confirm_stable_release=true after completing docs/RELEASE.md."
            exit 1
          fi

          evidence="docs/release-acceptance/${RELEASE_TAG}.md"
          if [ ! -f "$evidence" ]; then
            echo "::error::missing stable acceptance record: $evidence"
            exit 1
          fi

          require_exact_once() {
            local line="$1"
            local count
            count="$(grep -Fxc -- "$line" "$evidence" || true)"
            if [ "$count" != "1" ]; then
              echo "::error::$evidence must contain exactly once: $line"
              exit 1
            fi
          }

          require_exact_once "Release: $RELEASE_TAG"
          require_exact_once "Decision: ACCEPTED"
          require_exact_once "VPS acceptance: PASS"
          require_exact_once "Device acceptance: PASS"
          require_exact_once "Certificate renewal: PASS"

          rc_count="$(grep -c '^Accepted RC: ' "$evidence" || true)"
          commit_count="$(grep -c '^Accepted RC commit: ' "$evidence" || true)"
          if [ "$rc_count" != "1" ] || [ "$commit_count" != "1" ]; then
            echo "::error::$evidence must contain exactly one 'Accepted RC:' and one 'Accepted RC commit:' line"
            exit 1
          fi

          accepted_rc="$(sed -n 's/^Accepted RC: //p' "$evidence")"
          recorded_rc_commit="$(sed -n 's/^Accepted RC commit: //p' "$evidence")"

          case "$accepted_rc" in
            v*-*) ;;
            *)
              echo "::error::Accepted RC must be a prerelease tag such as v1.0.0-rc.1; got '$accepted_rc'"
              exit 1 ;;
          esac

          if ! printf '%s' "$recorded_rc_commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Accepted RC commit must be a full 40-character lowercase Git commit SHA"
            exit 1
          fi

          git fetch --force --tags origin
          if ! actual_rc_commit="$(git rev-parse "${accepted_rc}^{commit}" 2>/dev/null)"; then
            echo "::error::Accepted RC tag '$accepted_rc' does not exist"
            exit 1
          fi
          if [ "$recorded_rc_commit" != "$actual_rc_commit" ]; then
            echo "::error::recorded RC commit $recorded_rc_commit does not match $accepted_rc ($actual_rc_commit)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual_rc_commit" HEAD; then
            echo "::error::accepted RC $accepted_rc is not an ancestor of stable tag $RELEASE_TAG"
            exit 1
          fi

          # After real-world RC acceptance, production implementation is
          # frozen on the path to stable. Only release-status/evidence
          # documentation is permitted. Any other change requires a new RC
          # and another acceptance cycle.
          disallowed=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              README.md|docs/DEVICE_ACCEPTANCE_TESTS.md|"docs/release-acceptance/${RELEASE_TAG}.md")
                echo "allowed RC -> stable change: $path" ;;
              *)
                echo "::error::implementation/workflow change after accepted RC requires a new RC: $path"
                disallowed=1 ;;
            esac
          done < <(git diff --name-only "$actual_rc_commit" HEAD)

          if [ "$disallowed" -ne 0 ]; then
            exit 1
          fi

          echo "stable release policy accepted for $RELEASE_TAG from $accepted_rc ($actual_rc_commit)"

  # A release must not be publishable merely because binaries compiled. It
  # must pass the same gate as every other change: fmt, clippy, workspace
  # tests, shellcheck, cargo audit, secret-logging, release archive contract,
  # and real pinned sing-box interoperability checks.
  gate:
    needs: [validate-tag, validate-version, validate-release-policy]
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.validate-version.result == 'success' && needs.validate-release-policy.result == 'success' }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    # x86_64-unknown-linux-gnu is the only artifact this job builds. arm64
    # is NOT published (see docs/SUPPORTED_PRODUCT.md "Architecture
    # support" and docs/RELEASE.md): the old workflow cross-compiled an
    # aarch64-unknown-linux-gnu artifact and published it despite having
    # no way to execute/validate it on the runner (x86_64) — "cross-
    # compilation succeeded" was never evidence it actually runs anywhere.
    # Rather than publish another architecture's artifact with an
    # unvalidated ABI/runtime contract, this workflow stops publishing it
    # until arm64 gets the same real build-baseline + runtime-execution
    # validation x86_64 has below.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned release build image/baseline (deploy/lib/release-build.env)
        run: grep -vE '^\s*(#|$)' deploy/lib/release-build.env >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          targets: x86_64-unknown-linux-gnu

      # v1.0.0-rc.4 fix: the actual production compile (below) never
      # touches the runner's own $HOME/.cargo — it happens inside the
      # pinned AlmaLinux container against a dedicated, writable
      # $RUNNER_TEMP/release-cargo-home instead (see
      # deploy/lib/build-release-x86_64.sh's header comment for the full
      # incident: rc.4 bind-mounted $HOME/.cargo read-only into the
      # container and pointed CARGO_HOME at it, so `cargo build` could
      # never write a registry update/download and failed with "Read-
      # only file system" before compiling anything). $HOME/.cargo
      # cannot simply be made writable in-place either — the container
      # runs as root, so anything it wrote there would leave root-owned
      # files in the runner's own home directory.
      #
      # Point CARGO_HOME at that same dedicated directory BEFORE
      # Swatinem/rust-cache runs, so it restores/saves the registry the
      # container build actually reads and writes — caching the
      # unmodified host $HOME/.cargo here (the old behavior) would be a
      # cache action that looks useful but is no longer connected to the
      # production build at all.
      - name: Point CARGO_HOME at the dedicated release Cargo directory
        run: echo "CARGO_HOME=$RUNNER_TEMP/release-cargo-home" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-x86_64-unknown-linux-gnu

      # ---------------------------------------------------------------
      # Build inside a pinned AlmaLinux 8.10 container (glibc 2.28) —
      # NOT on ubuntu-latest's own host glibc (2.39 as of this runner
      # image, and not pinned/controlled by this project at all). This
      # is the actual fix for the v1.0.0-rc.3 incident: a Rust `-gnu`
      # target dynamically links against whatever libc.so.6 the linker
      # resolves against at build time, so the binary's resulting
      # minimum-glibc requirement is set by the environment doing the
      # link — not by the target triple, and not by an environment
      # variable (RUSTFLAGS cannot make rustc link against a different
      # libc than what's actually installed on the build host).
      #
      # This deliberately does NOT run the whole job inside the
      # container (`jobs.build.container:`): GitHub Actions injects its
      # own Node-based runner hooks into a container job to execute
      # actions like actions/checkout — whether that Node binary would
      # even run against AlmaLinux 8's glibc is untested and beside the
      # point. Instead, only the actual compilation — deploy/lib/
      # build-release-x86_64.sh's `docker run` invoking `cargo build` —
      # happens inside the pinned container; checkout/toolchain-setup/
      # attestation/upload all run normally on the runner. The toolchain
      # dtolnay/rust-toolchain just installed (rustc/cargo themselves
      # only need glibc <= 2.17 — they are build-time tools, not part of
      # the shipped artifact) is bind-mounted straight into the
      # container and used as-is, so the exact pinned Rust version above
      # is what compiles the release, with no separate toolchain
      # re-install/re-download inside the container and no drift
      # between the two.
      #
      # deploy/lib/build-release-x86_64.sh is the single source for this
      # container invocation — the same script also runs (in
      # --environment-check mode, without compiling anything) as a
      # cheap pre-tag smoke job in ci.yml, so a broken container/
      # toolchain/CARGO_HOME contract fails on every relevant PR instead
      # of only being discovered after a tag is cut (the process gap
      # that let PR #53 ship the rc.4 bug: release.yml only triggers on
      # tags/dispatch, so this exact invocation was never exercised by
      # that PR's own CI run).
      #
      # Verified locally before this change shipped: the resulting
      # vpn-admin/subscription binaries' maximum required GLIBC_* symbol
      # is exactly GLIBC_2.28, and they execute correctly (`--version`)
      # inside both almalinux:8.10 and almalinux:9 containers, with no
      # root-owned files left in $RUNNER_TEMP or the workspace (the
      # script runs the actual compile as the runner's own UID/GID,
      # which already owns every writable path it mounts). Building on
      # ubuntu-latest directly reproduces the field incident exactly
      # (GLIBC_2.29/2.30/2.32/2.33/2.34/2.39 not found on an AlmaLinux 8
      # host).
      - name: Build release binaries (AlmaLinux 8.10 / glibc <= 2.28 container)
        run: bash deploy/lib/build-release-x86_64.sh

      # Fail before packaging/attestation/publication ever see a binary
      # that cannot run on the declared baseline — see deploy/lib/
      # check-glibc-baseline.sh for the version-aware (never
      # lexicographic — "2.9" must compare below "2.28") comparison and
      # full diagnostics (file/readelf -d/readelf --version-info) it
      # prints for both vpn-admin and subscription.
      - name: Enforce release GLIBC ABI baseline
        run: |
          set -euo pipefail
          bash deploy/lib/check-glibc-baseline.sh "$RELEASE_GLIBC_BASELINE" \
            "target/x86_64-unknown-linux-gnu/release/vpn-admin" \
            "target/x86_64-unknown-linux-gnu/release/subscription"

      - name: Package
        run: |
          set -euo pipefail
          out="singbox-vpn-x86_64-unknown-linux-gnu"
          mkdir -p "$out"
          cp "target/x86_64-unknown-linux-gnu/release/vpn-admin" "$out/vpn-admin"
          cp "target/x86_64-unknown-linux-gnu/release/subscription" "$out/subscription"
          cp README.md LICENSE "$out/"
          tar -czf "${out}.tar.gz" "$out"
          sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256"

      - name: Attest binary archive provenance
        id: attest-binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: singbox-vpn-x86_64-unknown-linux-gnu.tar.gz

      # Publish the Sigstore bundle itself as a plain release asset, downloadable
      # over unauthenticated HTTPS exactly like the tarball/SHA256SUMS. This is
      # what makes anonymous verification possible at install time: GitHub's
      # attestations API requires a token even for public repos, and `gh
      # attestation verify` refuses to run at all without `gh auth login`/
      # GH_TOKEN — a fresh VPS has neither. cosign can verify this same
      # attestation entirely anonymously against the public Sigstore Rekor
      # transparency log once it has the bundle bytes in hand (see
      # docs/SUPPLY_CHAIN_SECURITY.md and verify_release_attestation() in
      # install.sh / deploy/almalinux/install.sh / deploy/almalinux/update.sh).
      - name: Publish binary archive attestation bundle
        run: cp "${{ steps.attest-binary.outputs.bundle-path }}" "singbox-vpn-x86_64-unknown-linux-gnu.tar.gz.sigstore.json"

      - name: Archive/installer contract test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf "singbox-vpn-x86_64-unknown-linux-gnu.tar.gz" -C "$tmp"
          extracted="$tmp/singbox-vpn-x86_64-unknown-linux-gnu"
          test -d "$extracted" || { echo "::error::archive did not contain singbox-vpn-x86_64-unknown-linux-gnu/ — install.sh's fetch_release_binaries() expects exactly this layout"; exit 1; }
          test -x "$extracted/vpn-admin" || { echo "::error::vpn-admin missing or not executable in archive"; exit 1; }
          test -x "$extracted/subscription" || { echo "::error::subscription missing or not executable in archive"; exit 1; }
          test -f "$extracted/LICENSE" || { echo "::error::LICENSE missing from release archive"; exit 1; }
          # Sanity check on the runner's own (newer) glibc — glibc is
          # backward compatible, so this only proves forward-compat, not
          # the actual conservative-baseline claim. The real, decisive
          # evidence for the declared baseline is the "Enforce release
          # GLIBC ABI baseline" step above (static ABI check) and the
          # runtime-compat job below (actual execution on AlmaLinux
          # 8/9 against this exact packaged archive).
          "$extracted/vpn-admin" --version
          "$extracted/subscription" --version
          rm -rf "$tmp"
          echo "archive/installer contract OK: layout matches deploy/almalinux/install.sh's fetch_release_binaries()"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: singbox-vpn-x86_64-unknown-linux-gnu
          path: |
            singbox-vpn-x86_64-unknown-linux-gnu.tar.gz
            singbox-vpn-x86_64-unknown-linux-gnu.tar.gz.sha256
            singbox-vpn-x86_64-unknown-linux-gnu.tar.gz.sigstore.json
          if-no-files-found: error

      - name: Package source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=singbox-vpn-src/ -o singbox-vpn-src.tar.gz HEAD
          sha256sum singbox-vpn-src.tar.gz > singbox-vpn-src.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf singbox-vpn-src.tar.gz -C "$tmp"
          test -x "$tmp/singbox-vpn-src/deploy/almalinux/install.sh" || {
            echo "::error::source archive cannot hand off to executable deploy/almalinux/install.sh"
            exit 1
          }
          rm -rf "$tmp"

      - name: Attest source archive provenance
        id: attest-source
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: singbox-vpn-src.tar.gz

      # See "Publish binary archive attestation bundle" above for why this
      # bundle file, not the GitHub attestations API, is the verification
      # channel a fresh install actually uses.
      - name: Publish source archive attestation bundle
        run: cp "${{ steps.attest-source.outputs.bundle-path }}" "singbox-vpn-src.tar.gz.sigstore.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: singbox-vpn-src
          path: |
            singbox-vpn-src.tar.gz
            singbox-vpn-src.tar.gz.sha256
            singbox-vpn-src.tar.gz.sigstore.json
          if-no-files-found: error

  # Real runtime-compatibility gate (Part C / Part D): extracts the EXACT
  # tar.gz that `publish` below would ship and executes it — with
  # absolute paths, never relying on PATH — inside clean AlmaLinux 8 and
  # AlmaLinux 9 containers. This is deliberately a container `docker run`
  # around plain shell, not a `jobs.<id>.container:` job (see the "Build
  # release binaries" step's comment for why): actions/download-artifact
  # runs normally on ubuntu-latest, and only the actual execution of the
  # untrusted-until-proven binaries happens inside the pinned images.
  #
  # AlmaLinux 8 is a best-effort compatibility check (never a supported
  # OS — see docs/SUPPORTED_PRODUCT.md); AlmaLinux 9 is the actual v1.0
  # SUPPORTED TARGET and its result is decisive.
  runtime-compat:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: almalinux-8
            image: "almalinux@sha256:9f355ae942d6a6c0561f0771dc053a2cfae9580fc45fa4252756db7c7e80c09f" # almalinux:8.10
          - name: almalinux-9
            image: "almalinux@sha256:3a3fa7f043b142bc8008c8b308d39b47d2c84008addcd52f9f9a7a82d2a90474" # almalinux:9 (9.8)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: singbox-vpn-x86_64-unknown-linux-gnu
          path: dist

      - name: Extract the exact packaged archive
        run: |
          set -euo pipefail
          mkdir -p extracted
          tar -xzf dist/singbox-vpn-x86_64-unknown-linux-gnu.tar.gz -C extracted
          test -x extracted/singbox-vpn-x86_64-unknown-linux-gnu/vpn-admin
          test -x extracted/singbox-vpn-x86_64-unknown-linux-gnu/subscription

      # A bare, unmodified distro image (no other vpn-admin/subscription
      # anywhere on its PATH) invoked purely by absolute path — this
      # cannot accidentally pick up any other locally-installed binary.
      - name: Execute the packaged archive on ${{ matrix.name }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/extracted/singbox-vpn-x86_64-unknown-linux-gnu":/artifact:ro \
            "${{ matrix.image }}" \
            bash -c '
              set -euo pipefail
              echo "--- /artifact/vpn-admin --version ---"
              /artifact/vpn-admin --version
              echo "--- /artifact/subscription --version ---"
              /artifact/subscription --version
            '

  publish:
    needs: [build, runtime-compat]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.runtime-compat.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Build combined checksum file
        run: |
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.sigstore.json
            dist/SHA256SUMS
          generate_release_notes: true

  # Exercise the public assets after GitHub has published them. The fake
  # final handoff keeps this read-only while still running the real bootstrap
  # through release resolution, checksum verification, extraction, and the
  # deploy/almalinux/install.sh boundary.
  verify-published-bootstrap:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify published release through the real bootstrap
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          testbin="$(mktemp -d)"
          marker="$(mktemp)"
          trap 'rm -rf "$testbin" "$marker"' EXIT

          cat > "$testbin/id" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "-u" ]; then
            printf '0\n'
            exit 0
          fi
          exec /usr/bin/id "$@"
          EOF

          cat > "$testbin/bash" <<'EOF'
          #!/bin/sh
          set -eu
          installer="${1:-}"
          [ -n "$installer" ] || { echo "missing installer handoff path" >&2; exit 1; }
          shift
          [ -x "$installer" ] || { echo "handoff target is not executable: $installer" >&2; exit 1; }
          case "$installer" in
            */deploy/almalinux/install.sh) ;;
            *) echo "unexpected handoff target: $installer" >&2; exit 1 ;;
          esac
          [ "${SINGBOX_VPN_VERSION:-}" = "${RELEASE_TAG:?}" ] || {
            echo "bootstrap handed off SINGBOX_VPN_VERSION='${SINGBOX_VPN_VERSION:-}', expected '$RELEASE_TAG'" >&2
            exit 1
          }
          printf '%s\n' "$*" > "${SINGBOX_VPN_BOOTSTRAP_VERIFY_MARKER:?}"
          EOF

          chmod +x "$testbin/id" "$testbin/bash"
          export SINGBOX_VPN_BOOTSTRAP_VERIFY_MARKER="$marker"
          PATH="$testbin:$PATH" /usr/bin/bash install.sh \
            --version "$RELEASE_TAG" \
            --non-interactive \
            --allow-ip-hostname \
            --reality-handshake-server www.cloudflare.com

          grep -Fxq -- '--non-interactive --allow-ip-hostname --reality-handshake-server www.cloudflare.com' "$marker"
          echo "published bootstrap verified for $RELEASE_TAG"