name: Release

# Builds prebuilt singbox-vpn binaries (vpn-admin, subscription) so
# deploy/almalinux/install.sh (and the root install.sh bootstrap) can
# install a production VPS without a Rust toolchain.
#
# Prerelease tags (for example v1.0.0-rc.1) may publish automatically after
# the canonical CI gate. Stable tags never auto-publish: they require an
# explicit workflow_dispatch from the exact stable tag plus the acceptance
# record defined in docs/RELEASE.md.

on:
  push:
    # Only prerelease tags auto-publish. A stable vX.Y.Z tag is intentionally
    # excluded and must be released through workflow_dispatch after the real
    # VPS/device acceptance evidence is committed.
    tags: ["v*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact tag to build and publish (e.g. v1.0.0-rc.1 or v1.0.0)"
        required: true
      confirm_stable_release:
        description: "Required for a stable vX.Y.Z release after RC/VPS/device acceptance"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

# Default every release job to read-only. Build narrows in OIDC/attestation
# writes; publish narrows in contents:write. No other job receives write scope.
permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm tag push ref
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::release push was not a tag ref: ${{ github.ref }}"
            exit 1
          fi
          case "$RELEASE_TAG" in
            *-*) ;;
            *)
              echo "::error::stable tags must not auto-publish. Run this workflow manually from the exact stable tag after completing docs/RELEASE.md."
              exit 1 ;;
          esac
          echo "ok: prerelease triggered by tag $RELEASE_TAG"

      - name: Confirm dispatch ref is the requested tag
        if: github.event_name == 'workflow_dispatch'
        # Contract: github.ref_name must equal github.event.inputs.tag. The
        # values are routed through env rather than interpolated into shell
        # code so a tag/input can never become script text.
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$REQUESTED_TAG" ]; then
            echo "::error::workflow_dispatch was run from ref '$REF_NAME' (type: $REF_TYPE), but the tag input requested '$REQUESTED_TAG'. Re-run using 'Use workflow from' set to the exact '$REQUESTED_TAG' tag."
            exit 1
          fi
          echo "ok: dispatched from exact tag $REF_NAME"

  validate-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm release tag matches packaged Rust versions
        run: bash deploy/lib/check-release-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

  validate-release-policy:
    needs: [validate-tag, validate-version]
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.validate-version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce stable RC acceptance policy
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_STABLE_RELEASE: ${{ github.event.inputs.confirm_stable_release || 'false' }}
        run: |
          set -euo pipefail

          # Prereleases are intentionally allowed through after tag/version
          # validation and the canonical CI graph below. Stable releases have
          # the stronger evidence gate.
          case "$RELEASE_TAG" in
            *-*)
              echo "ok: $RELEASE_TAG is a prerelease; stable acceptance record is not required yet."
              exit 0 ;;
          esac

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::stable releases are manual-only. Use workflow_dispatch from the exact stable tag."
            exit 1
          fi
          if [ "$CONFIRM_STABLE_RELEASE" != "true" ]; then
            echo "::error::stable release requires confirm_stable_release=true after completing docs/RELEASE.md."
            exit 1
          fi

          evidence="docs/release-acceptance/${RELEASE_TAG}.md"
          if [ ! -f "$evidence" ]; then
            echo "::error::missing stable acceptance record: $evidence"
            exit 1
          fi

          require_exact_once() {
            local line="$1"
            local count
            count="$(grep -Fxc -- "$line" "$evidence" || true)"
            if [ "$count" != "1" ]; then
              echo "::error::$evidence must contain exactly once: $line"
              exit 1
            fi
          }

          require_exact_once "Release: $RELEASE_TAG"
          require_exact_once "Decision: ACCEPTED"
          require_exact_once "VPS acceptance: PASS"
          require_exact_once "Device acceptance: PASS"
          require_exact_once "Certificate renewal: PASS"

          rc_count="$(grep -c '^Accepted RC: ' "$evidence" || true)"
          commit_count="$(grep -c '^Accepted RC commit: ' "$evidence" || true)"
          if [ "$rc_count" != "1" ] || [ "$commit_count" != "1" ]; then
            echo "::error::$evidence must contain exactly one 'Accepted RC:' and one 'Accepted RC commit:' line"
            exit 1
          fi

          accepted_rc="$(sed -n 's/^Accepted RC: //p' "$evidence")"
          recorded_rc_commit="$(sed -n 's/^Accepted RC commit: //p' "$evidence")"

          case "$accepted_rc" in
            v*-*) ;;
            *)
              echo "::error::Accepted RC must be a prerelease tag such as v1.0.0-rc.1; got '$accepted_rc'"
              exit 1 ;;
          esac

          if ! printf '%s' "$recorded_rc_commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Accepted RC commit must be a full 40-character lowercase Git commit SHA"
            exit 1
          fi

          git fetch --force --tags origin
          if ! actual_rc_commit="$(git rev-parse "${accepted_rc}^{commit}" 2>/dev/null)"; then
            echo "::error::Accepted RC tag '$accepted_rc' does not exist"
            exit 1
          fi
          if [ "$recorded_rc_commit" != "$actual_rc_commit" ]; then
            echo "::error::recorded RC commit $recorded_rc_commit does not match $accepted_rc ($actual_rc_commit)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual_rc_commit" HEAD; then
            echo "::error::accepted RC $accepted_rc is not an ancestor of stable tag $RELEASE_TAG"
            exit 1
          fi

          # After real-world RC acceptance, production implementation must not
          # change silently on the path to stable. Only release metadata and
          # evidence documentation are permitted. Any other change requires a
          # new RC and another acceptance cycle.
          disallowed=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              Cargo.toml|Cargo.lock|README.md|docs/DEVICE_ACCEPTANCE_TESTS.md|"docs/release-acceptance/${RELEASE_TAG}.md")
                echo "allowed RC -> stable change: $path" ;;
              *)
                echo "::error::implementation/workflow change after accepted RC requires a new RC: $path"
                disallowed=1 ;;
            esac
          done < <(git diff --name-only "$actual_rc_commit" HEAD)

          if [ "$disallowed" -ne 0 ]; then
            exit 1
          fi

          echo "stable release policy accepted for $RELEASE_TAG from $accepted_rc ($actual_rc_commit)"

  # A release must not be publishable merely because binaries compiled. It
  # must pass the same gate as every other change: fmt, clippy, workspace
  # tests, shellcheck, cargo audit, secret-logging, release archive contract,
  # and real pinned sing-box interoperability checks.
  gate:
    needs: [validate-tag, validate-version, validate-release-policy]
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.validate-version.result == 'success' && needs.validate-release-policy.result == 'success' }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p admin -p subscription

      - name: Package
        run: |
          set -euo pipefail
          out="singbox-vpn-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/vpn-admin" "$out/vpn-admin"
          cp "target/${{ matrix.target }}/release/subscription" "$out/subscription"
          cp README.md LICENSE "$out/"
          tar -czf "${out}.tar.gz" "$out"
          sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256"

      - name: Attest binary archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: singbox-vpn-${{ matrix.target }}.tar.gz

      - name: Archive/installer contract test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf "singbox-vpn-${{ matrix.target }}.tar.gz" -C "$tmp"
          extracted="$tmp/singbox-vpn-${{ matrix.target }}"
          test -d "$extracted" || { echo "::error::archive did not contain singbox-vpn-${{ matrix.target }}/ — install.sh's fetch_release_binaries() expects exactly this layout"; exit 1; }
          test -x "$extracted/vpn-admin" || { echo "::error::vpn-admin missing or not executable in archive"; exit 1; }
          test -x "$extracted/subscription" || { echo "::error::subscription missing or not executable in archive"; exit 1; }
          test -f "$extracted/LICENSE" || { echo "::error::LICENSE missing from release archive"; exit 1; }
          if [ "${{ matrix.target }}" = "$(uname -m)-unknown-linux-gnu" ]; then
            "$extracted/vpn-admin" --version
            "$extracted/subscription" --version
          else
            echo "skipping --version execution: ${{ matrix.target }} is cross-compiled, cannot run on $(uname -m) runner"
          fi
          rm -rf "$tmp"
          echo "archive/installer contract OK: layout matches deploy/almalinux/install.sh's fetch_release_binaries()"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: singbox-vpn-${{ matrix.target }}
          path: |
            singbox-vpn-${{ matrix.target }}.tar.gz
            singbox-vpn-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

      - name: Package source archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=singbox-vpn-src/ -o singbox-vpn-src.tar.gz HEAD
          sha256sum singbox-vpn-src.tar.gz > singbox-vpn-src.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf singbox-vpn-src.tar.gz -C "$tmp"
          test -x "$tmp/singbox-vpn-src/deploy/almalinux/install.sh" || {
            echo "::error::source archive cannot hand off to executable deploy/almalinux/install.sh"
            exit 1
          }
          rm -rf "$tmp"

      - name: Attest source archive provenance
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: singbox-vpn-src.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: singbox-vpn-src
          path: |
            singbox-vpn-src.tar.gz
            singbox-vpn-src.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Build combined checksum file
        run: |
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

  # Exercise the public assets after GitHub has published them. The fake
  # final handoff keeps this read-only while still running the real bootstrap
  # through release resolution, checksum verification, extraction, and the
  # deploy/almalinux/install.sh boundary.
  verify-published-bootstrap:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify published release through the real bootstrap
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          testbin="$(mktemp -d)"
          marker="$(mktemp)"
          trap 'rm -rf "$testbin" "$marker"' EXIT

          cat > "$testbin/id" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "-u" ]; then
            printf '0\n'
            exit 0
          fi
          exec /usr/bin/id "$@"
          EOF

          cat > "$testbin/bash" <<'EOF'
          #!/bin/sh
          set -eu
          installer="${1:-}"
          [ -n "$installer" ] || { echo "missing installer handoff path" >&2; exit 1; }
          shift
          [ -x "$installer" ] || { echo "handoff target is not executable: $installer" >&2; exit 1; }
          case "$installer" in
            */deploy/almalinux/install.sh) ;;
            *) echo "unexpected handoff target: $installer" >&2; exit 1 ;;
          esac
          [ "${SINGBOX_VPN_VERSION:-}" = "${RELEASE_TAG:?}" ] || {
            echo "bootstrap handed off SINGBOX_VPN_VERSION='${SINGBOX_VPN_VERSION:-}', expected '$RELEASE_TAG'" >&2
            exit 1
          }
          printf '%s\n' "$*" > "${SINGBOX_VPN_BOOTSTRAP_VERIFY_MARKER:?}"
          EOF

          chmod +x "$testbin/id" "$testbin/bash"
          export SINGBOX_VPN_BOOTSTRAP_VERIFY_MARKER="$marker"
          PATH="$testbin:$PATH" /usr/bin/bash install.sh \
            --version "$RELEASE_TAG" \
            --non-interactive \
            --allow-ip-hostname \
            --reality-handshake-server www.cloudflare.com

          grep -Fxq -- '--non-interactive --allow-ip-hostname --reality-handshake-server www.cloudflare.com' "$marker"
          echo "published bootstrap verified for $RELEASE_TAG"
