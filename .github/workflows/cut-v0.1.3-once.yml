name: One-shot v0.1.3 release driver

on:
  push:
    branches:
      - automation/cut-v0.1.3

permissions:
  contents: write
  actions: write

jobs:
  cut-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: baac260565e0ce1e7b3821a101e41fdd92b762d1
      RELEASE_TAG: v0.1.3
    steps:
      - name: Checkout exact accepted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: baac260565e0ce1e7b3821a101e41fdd92b762d1
          fetch-depth: 0

      - name: Verify target and create tag if absent
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "::error::checked out $actual, expected $TARGET_SHA"
            exit 1
          }

          remote_sha="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            test "$remote_sha" = "$TARGET_SHA" || {
              echo "::error::$RELEASE_TAG already exists at $remote_sha, expected $TARGET_SHA"
              exit 1
            }
            echo "$RELEASE_TAG already points to the accepted target; not recreating it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_TAG" "$TARGET_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Dispatch canonical release workflow from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(jq -n --arg ref "$RELEASE_TAG" --arg tag "$RELEASE_TAG" '{ref:$ref,inputs:{tag:$tag}}')"
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -d "$payload"
          echo "Dispatched release.yml for $RELEASE_TAG at $TARGET_SHA"
