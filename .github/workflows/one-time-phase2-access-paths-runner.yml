name: One-time Phase 2 access paths runner

on:
  push:
    branches:
      - chatgpt/phase2-access-paths

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/phase2-access-paths
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9
      - name: Apply implementation script from staged workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-time-phase2-access-paths.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw_lines = source[start:end].splitlines()
          cooked = []
          in_triple = False
          for raw in raw_lines:
              if in_triple:
                  line = raw
              else:
                  line = raw[10:] if raw.startswith("          ") else raw
              cooked.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          if in_triple:
              raise SystemExit('unterminated triple-quoted string in staged implementation')
          code = "\n".join(cooked)
          exec(compile(code, 'phase2-access-paths-extracted.py', 'exec'), {})

          # AppState is also constructed in three in-module test helpers. They
          # deliberately use no relay metadata; make that compatibility intent
          # explicit rather than weakening the new required state field.
          p = Path('services/subscription/src/lib.rs')
          s = p.read_text()
          needle = '            rate_limiter: Mutex::new(RateLimiter::new(1000.0, 1000.0)),\n'
          if s.count(needle) != 3:
              raise SystemExit(f'expected three AppState test rate limiters, found {s.count(needle)}')
          s = s.replace(needle, '            access_paths: Vec::new(),\n' + needle)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --locked -p provisioning-contract
          cargo test --locked -p compat-config
          cargo test --locked -p subscription
          git diff --check
      - name: Commit implementation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/provisioning-contract/src/lib.rs \
            crates/provisioning-contract/tests/access_paths.rs \
            crates/compat-config/src/deployment.rs \
            crates/compat-config/src/contract.rs \
            crates/compat-config/tests/access_paths.rs \
            services/subscription/src/lib.rs \
            services/subscription/src/main.rs
          git diff --cached --check
          git commit -m "feat(provisioning): add non-secret access path metadata"
          git push origin HEAD:chatgpt/phase2-access-paths
