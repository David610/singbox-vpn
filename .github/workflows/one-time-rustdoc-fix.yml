name: One-time rustdoc repair

on:
  push:
    branches:
      - chatgpt/phase2-reachable-first-hop-design

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/phase2-reachable-first-hop-design
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair private rustdoc link and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/provisioning-contract/src/lib.rs')
          s = p.read_text()
          old = "/// [`ProvisioningDocument::audit_embedded_config`]. **Never logged:**"
          new = "/// `ProvisioningDocument::audit_embedded_config`. **Never logged:**"
          if old not in s:
              raise SystemExit('expected rustdoc text not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/one-time-rustdoc-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/provisioning-contract/src/lib.rs .github/workflows/one-time-rustdoc-fix.yml
          git commit -m "docs: fix private provisioning rustdoc link"
          git push origin HEAD:chatgpt/phase2-reachable-first-hop-design
