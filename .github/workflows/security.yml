name: Security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

# Security jobs are read-only by default. CodeQL narrows the one write scope
# it needs to upload SARIF/code-scanning results.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Incremental GitHub dependency-review is intentionally not wired here yet:
  # this repository currently has GitHub's Dependency graph disabled, and the
  # official action fails closed when that repository feature is unavailable.
  # Cargo.lock is still scanned by the existing blocking `cargo audit` CI job.
  # Once Dependency graph is enabled in repository Security settings, add the
  # official dependency-review action back as a blocking pull-request gate.

  codeql-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL for Rust
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Analyze Rust
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8

  codeql-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL for GitHub Actions
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          languages: actions
          queries: security-extended
      - name: Analyze workflows
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
