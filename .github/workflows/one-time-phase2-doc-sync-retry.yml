name: One-time Phase 2 documentation sync retry

on:
  push:
    branches:
      - chatgpt/phase2-access-paths

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/phase2-access-paths
          fetch-depth: 0
      - name: Apply the audited documentation sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-time-phase2-doc-sync.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in source[start:end].splitlines()
          )
          exec(compile(code, 'phase2-doc-sync.py', 'exec'), {})

          path = Path('docs/REACHABLE_FIRST_HOP_ARCHITECTURE.md')
          text = path.read_text()
          text = text.replace(
              '**Status:** Phase-2 access-path metadata foundation implemented; production relay/chained routing remains design-only and unverified.  \n',
              '**Status:** Phase-2 access-path metadata foundation implemented; production relay/chained routing remains design-only and unverified.\n',
          )
          text = text.replace(
              '**Stage 0 — complete locally:** Phase-1 direct multi-endpoint failover.  \n',
              '**Stage 0 — complete locally:** Phase-1 direct multi-endpoint failover.\n',
          )
          text = text.replace(
              '**Stage 1 — in progress:** additive non-secret access-path metadata is implemented; Core detour fixtures + `SIMULATED_ALLOWLIST` harness remain.  \n',
              '**Stage 1 — in progress:** additive non-secret access-path metadata is implemented; Core detour fixtures + `SIMULATED_ALLOWLIST` harness remain.\n',
          )
          path.write_text(text)
          PY

          cargo fmt --all -- --check
          git diff --check
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/REACHABLE_FIRST_HOP_ARCHITECTURE.md \
            docs/PROVISIONING_CONTRACT.md \
            docs/IMPLEMENTATION_STATUS.md \
            docs/CLIENT_PROTOCOL_BEHAVIOR.md \
            docs/CLIENT_COMPATIBILITY.md \
            crates/provisioning-contract/src/lib.rs
          git diff --cached --check
          git commit -m "docs: synchronize Phase 2 access-path status"
          git push origin HEAD:chatgpt/phase2-access-paths
