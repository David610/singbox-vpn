name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Every branch push with an open PR fires this workflow twice (`push` +
# `pull_request`). Without a concurrency group, superseded runs are never
# cancelled: pushing three commits in a row leaves six full pipelines
# racing, which both wastes runner minutes and multiplies exposure to any
# flaky job. Keyed by ref so `main` and each branch queue independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing in this workflow writes to the repository, so
# the default (potentially write-capable) GITHUB_TOKEN scope is more than
# any job here needs. `release.yml` grants `contents: write` narrowly to
# the one job that publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # Blocking (docs/PRODUCTION_HARDENING_PLAN.md #12): no `|| true`.
      # If an advisory genuinely cannot be fixed yet, add a narrowly
      # scoped `--ignore RUSTSEC-XXXX-YYYY` here with a comment citing
      # the advisory and why — never a blanket suppression.
      # No `--locked` here: `cargo audit` reads the committed `Cargo.lock`
      # directly and rejects the flag. The other cargo jobs pass it so they
      # cannot silently audit-adjacent-build a different dependency set
      # than the one this job scanned.
      - run: cargo audit

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `cargo doc` exits 0 on broken intra-doc links and other rustdoc
    # warnings, so without this the job proves only that rustdoc did not
    # crash. `clippy` above is already `-D warnings`; this is the same
    # standard applied to documentation.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --locked --workspace --no-deps

  shell:
    # Shell-script hygiene gate (docs/FINAL_PRODUCTION_AUDIT.md P2): every
    # shipped shell script must at minimum parse, and shellcheck-clean at
    # the severity level we can realistically keep clean. Blocking — no
    # `|| true`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax check every shipped script)
        run: |
          set -euo pipefail
          for f in install.sh deploy/almalinux/*.sh deploy/lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: shellcheck
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S warning install.sh deploy/lib/*.sh deploy/almalinux/*.sh

  secret-logging-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/lib/check-no-secret-logging.sh

  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: test -s LICENSE

  singbox-validate:
    # Real-binary validation (docs/PRODUCTION_HARDENING_PLAN.md #11):
    # downloads the exact pinned sing-box release (never `latest`),
    # verifies it against upstream checksums when published (same logic
    # as deploy/almalinux/install.sh, not duplicated by hand so the two
    # can't silently drift), then renders a real server config via
    # `vpn-admin` and validates it with the actual `sing-box check`
    # binary — not just the injected-closure unit tests. Blocking: no
    # `|| true` anywhere in this job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SINGBOX_VERSION: "1.13.14"
      # Kept in lockstep with deploy/almalinux/install.sh's
      # SINGBOX_SHA256_AMD64 — same reasoning: this is the checked-in
      # trusted digest used when upstream doesn't publish its own
      # checksums.txt for this release (docs/FINAL_PRODUCTION_AUDIT.md P0-8).
      SINGBOX_SHA256_AMD64: "f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download pinned sing-box release
        run: |
          set -euo pipefail
          tarball="sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/${tarball}"
          curl -fsSL -o "$tarball" "$url"
          sums_url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box_${SINGBOX_VERSION}_checksums.txt"
          if curl -fsSL -o checksums.txt "$sums_url"; then
            sha256sum --ignore-missing -c checksums.txt
          else
            actual="$(sha256sum "$tarball" | awk '{print $1}')"
            if [ "$actual" != "$SINGBOX_SHA256_AMD64" ]; then
              echo "::error::sing-box checksum mismatch: expected $SINGBOX_SHA256_AMD64, got $actual"
              exit 1
            fi
            echo "verified against pinned expected SHA256 (no upstream checksums.txt for this release)."
          fi
          tar -xzf "$tarball"
          install -m 0755 "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Build vpn-admin
        run: cargo build --locked --release -p admin

      - name: Render + validate a real server config with the real binary
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/vpn-compat-test"
          mkdir -p "$STATE/hysteria"
          # sing-box check requires a syntactically valid cert/key pair to
          # exist at the configured paths even in a check-only run.
          openssl req -x509 -newkey ed25519 -days 1 -nodes \
            -keyout "$STATE/hysteria/key.pem" -out "$STATE/hysteria/cert.pem" \
            -subj "/CN=ci-test.example.com"

          cat > "$RUNNER_TEMP/deployment.toml" <<EOF
          public_host = "ci-test.example.com"
          subscription_host = "sub.ci-test.example.com"
          state_dir = "$STATE"
          singbox_binary = "/usr/local/bin/sing-box"

          [reality]
          listen_port = 443
          handshake_server = "www.google.com"

          [hysteria2]
          listen_port = 443

          [subscription]
          listen_port = 9100
          EOF

          BIN=./target/release/vpn-admin
          VPN1_ALLOW_OFFLINE_MUTATION=1 "$BIN" --config "$RUNNER_TEMP/deployment.toml" init
          VPN1_ALLOW_OFFLINE_MUTATION=1 "$BIN" --config "$RUNNER_TEMP/deployment.toml" user create --name ci-test-user
          "$BIN" --config "$RUNNER_TEMP/deployment.toml" render-config

          echo "running real sing-box check against the generated server config:"
          sing-box check -c "$STATE/sing-box/config.json"

      # A test that always skips is documentation, not regression
      # protection. This is the one job with the pinned, checksum-verified
      # binary on disk, so it is the one responsible for actually RUNNING
      # the interop suites for real.
      #
      # Two mechanical guarantees, because "CI stayed green" is NOT proof
      # the tests ran (it previously wasn't: the `test` job above runs the
      # same binaries with no sing-box and reports `ok` for every one of
      # them):
      #   1. VPN1_REQUIRE_REAL_INTEROP=1 turns every in-test skip into a
      #      hard panic, so a missing binary/openssl fails the job.
      #   2. The expected pass counts are asserted below, so a test that is
      #      deleted, renamed, or silently stops running fails the job too.
      - name: Real VLESS+REALITY and Hysteria2 interoperability tests (real sing-box)
        env:
          SING_BOX_BIN: /usr/local/bin/sing-box
          VPN1_REQUIRE_REAL_INTEROP: "1"
        run: |
          set -euo pipefail
          cargo test --locked -p compat-config \
            --test reality_interop --test reality_decoy_budget --test hysteria2_interop \
            -- --nocapture 2>&1 | tee interop.log

          # Assert the exact number of tests that actually executed.
          # Update this count deliberately when adding a test — never by
          # pasting whatever the log happened to print.
          #   3 reality_interop + 1 reality_decoy_budget + 4 hysteria2_interop
          #   (2 original + 2 added for salamander obfuscation coverage)
          expected=8
          total_ok="$(grep -c "^test .* \.\.\. ok$" interop.log || true)"
          if [ "$total_ok" != "$expected" ]; then
            echo "::error::expected $expected real interop tests to run and pass, saw $total_ok"
            exit 1
          fi
          if grep -q "^skipping:" interop.log; then
            echo "::error::an interop test skipped despite VPN1_REQUIRE_REAL_INTEROP=1"
            exit 1
          fi
          echo "all $total_ok real-binary interop tests executed and passed"
