name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # Blocking (docs/PRODUCTION_HARDENING_PLAN.md #12): no `|| true`.
      # If an advisory genuinely cannot be fixed yet, add a narrowly
      # scoped `--ignore RUSTSEC-XXXX-YYYY` here with a comment citing
      # the advisory and why — never a blanket suppression.
      - run: cargo audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps

  shell:
    # Shell-script hygiene gate (docs/FINAL_PRODUCTION_AUDIT.md P2): every
    # shipped shell script must at minimum parse, and shellcheck-clean at
    # the severity level we can realistically keep clean. Blocking — no
    # `|| true`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax check every shipped script)
        run: |
          set -euo pipefail
          for f in install.sh deploy/almalinux/*.sh deploy/lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: shellcheck
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S warning install.sh deploy/lib/*.sh deploy/almalinux/*.sh

  secret-logging-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/lib/check-no-secret-logging.sh

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s LICENSE

  singbox-validate:
    # Real-binary validation (docs/PRODUCTION_HARDENING_PLAN.md #11):
    # downloads the exact pinned sing-box release (never `latest`),
    # verifies it against upstream checksums when published (same logic
    # as deploy/almalinux/install.sh, not duplicated by hand so the two
    # can't silently drift), then renders a real server config via
    # `vpn-admin` and validates it with the actual `sing-box check`
    # binary — not just the injected-closure unit tests. Blocking: no
    # `|| true` anywhere in this job.
    runs-on: ubuntu-latest
    env:
      SINGBOX_VERSION: "1.13.14"
      # Kept in lockstep with deploy/almalinux/install.sh's
      # SINGBOX_SHA256_AMD64 — same reasoning: this is the checked-in
      # trusted digest used when upstream doesn't publish its own
      # checksums.txt for this release (docs/FINAL_PRODUCTION_AUDIT.md P0-8).
      SINGBOX_SHA256_AMD64: "f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download pinned sing-box release
        run: |
          set -euo pipefail
          tarball="sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/${tarball}"
          curl -fsSL -o "$tarball" "$url"
          sums_url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box_${SINGBOX_VERSION}_checksums.txt"
          if curl -fsSL -o checksums.txt "$sums_url"; then
            sha256sum --ignore-missing -c checksums.txt
          else
            actual="$(sha256sum "$tarball" | awk '{print $1}')"
            if [ "$actual" != "$SINGBOX_SHA256_AMD64" ]; then
              echo "::error::sing-box checksum mismatch: expected $SINGBOX_SHA256_AMD64, got $actual"
              exit 1
            fi
            echo "verified against pinned expected SHA256 (no upstream checksums.txt for this release)."
          fi
          tar -xzf "$tarball"
          install -m 0755 "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Build vpn-admin
        run: cargo build --release -p admin

      - name: Render + validate a real server config with the real binary
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/vpn-compat-test"
          mkdir -p "$STATE/hysteria"
          # sing-box check requires a syntactically valid cert/key pair to
          # exist at the configured paths even in a check-only run.
          openssl req -x509 -newkey ed25519 -days 1 -nodes \
            -keyout "$STATE/hysteria/key.pem" -out "$STATE/hysteria/cert.pem" \
            -subj "/CN=ci-test.example.com"

          cat > "$RUNNER_TEMP/deployment.toml" <<EOF
          public_host = "ci-test.example.com"
          subscription_host = "sub.ci-test.example.com"
          state_dir = "$STATE"
          singbox_binary = "/usr/local/bin/sing-box"

          [reality]
          listen_port = 443
          handshake_server = "www.microsoft.com"

          [hysteria2]
          listen_port = 443

          [subscription]
          listen_port = 9100
          EOF

          BIN=./target/release/vpn-admin
          "$BIN" --config "$RUNNER_TEMP/deployment.toml" init
          "$BIN" --config "$RUNNER_TEMP/deployment.toml" user create --name ci-test-user
          "$BIN" --config "$RUNNER_TEMP/deployment.toml" render-config

          echo "running real sing-box check against the generated server config:"
          sing-box check -c "$STATE/sing-box/config.json"

      # A test that always skips (no `sing-box` on PATH, no `SING_BOX_BIN`
      # set) is documentation, not regression protection — this is the one
      # job in this pipeline that has the pinned, checksum-verified binary
      # on disk, so it is also the one responsible for actually RUNNING
      # `crates/compat-config/tests/reality_interop.rs` and `.../
      # hysteria2_interop.rs` for real, not just building them. If these
      # ever silently skip here (e.g. `sing-box` isn't on PATH after the
      # install step above), the workflow log's "skipping: no sing-box
      # binary available" line makes that visible, but CI staying green is
      # NOT proof they ran — see the `test result` line's pass count in
      # the log for confirmation that both suites' tests actually executed
      # (each prints a pass count, not just "ok").
      - name: Real VLESS+REALITY and Hysteria2 interoperability tests (real sing-box)
        env:
          SING_BOX_BIN: /usr/local/bin/sing-box
        run: |
          set -euo pipefail
          cargo test -p compat-config --test reality_interop --test hysteria2_interop -- --nocapture
