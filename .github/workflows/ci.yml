name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets release.yml invoke this exact same job graph as its release gate
  # (Checkpoint 6 §9) instead of re-implementing/duplicating any of these
  # checks. No inputs: a reusable-workflow call always runs against the
  # caller's own triggering ref/commit, which is what a release gate needs.
  workflow_call:

# Every branch push with an open PR fires this workflow twice (`push` +
# `pull_request`). Without a concurrency group, superseded runs are never
# cancelled: pushing three commits in a row leaves six full pipelines
# racing, which both wastes runner minutes and multiplies exposure to any
# flaky job. Keyed by ref so `main` and each branch queue independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing in this workflow writes to the repository, so
# the default (potentially write-capable) GITHUB_TOKEN scope is more than
# any job here needs. `release.yml` grants `contents: write` narrowly to
# the one job that publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
      - uses: taiki-e/install-action@f347db2dee5edb1a4bddcbed2220c6e7828a0fad # cargo-audit
      # Blocking (docs/PRODUCTION_HARDENING_PLAN.md #12): no `|| true`.
      # If an advisory genuinely cannot be fixed yet, add a narrowly
      # scoped `--ignore RUSTSEC-XXXX-YYYY` here with a comment citing
      # the advisory and why — never a blanket suppression.
      # No `--locked` here: `cargo audit` reads the committed `Cargo.lock`
      # directly and rejects the flag. The other cargo jobs pass it so they
      # cannot silently audit-adjacent-build a different dependency set
      # than the one this job scanned.
      - run: cargo audit

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `cargo doc` exits 0 on broken intra-doc links and other rustdoc
    # warnings, so without this the job proves only that rustdoc did not
    # crash. `clippy` above is already `-D warnings`; this is the same
    # standard applied to documentation.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
      - run: cargo doc --locked --workspace --no-deps

  shell:
    # Shell-script hygiene gate (docs/FINAL_PRODUCTION_AUDIT.md P2): every
    # shipped shell script must at minimum parse, and shellcheck-clean at
    # the severity level we can realistically keep clean. Blocking — no
    # `|| true`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: bash -n (syntax check every shipped script)
        run: |
          set -euo pipefail
          for f in install.sh uninstall.sh bin/vpn1-uninstall deploy/almalinux/*.sh deploy/lib/*.sh deploy/lib/tests/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: shellcheck
        # ubuntu-latest already ships shellcheck and jq, so installing them
        # unconditionally only ever bought idn2 — and idn2 is NOT actually
        # required: deploy/lib/tests/test-idn-punycode.sh explicitly treats
        # its absence as a valid SKIP that exercises a real, intentional
        # code path (derive_punycode_host()'s fallback-to-unchanged-input
        # behavior), not a weakened test. Unconditionally running
        # `apt-get update && apt-get install` here bought nothing but a
        # flaky network round-trip on every run — it has hung for the full
        # job timeout more than once (an `apt-get update` mirror stall
        # that a bounded `timeout` turned into a clean but still-fatal
        # exit 124 rather than fixing). Only install what's genuinely
        # missing and required (shellcheck itself), bounded and
        # non-interactive, so a real gap still fails fast instead of
        # hanging, but the common case never touches the network.
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a NEEDRESTART_SUSPEND=1
            timeout 60 sudo apt-get update -y >/dev/null
            timeout 90 sudo apt-get install -y shellcheck >/dev/null
          fi
          shellcheck -S warning install.sh uninstall.sh bin/vpn1-uninstall deploy/lib/*.sh deploy/almalinux/*.sh deploy/lib/tests/*.sh
      # Run the complete deterministic suite rather than maintaining a
      # second hand-written list here. The old list omitted transactional
      # update, fresh-install acceptance, schema migration, release
      # reproducibility, and ownership-safe uninstall regressions even
      # though those tests shipped in this directory. `sudo` is required by
      # the tests that exercise root-owned staging/uninstall safeguards; all
      # tests use isolated fixtures and none performs a real host install.
      - name: deployment lifecycle and shell regression tests
        run: |
          set -euo pipefail
          for test_script in deploy/lib/tests/*.sh; do
            echo "::group::$test_script"
            sudo bash "$test_script"
            echo "::endgroup::"
          done

  os-matrix:
    # L1/L2 server-support-matrix regression coverage (docs/SUPPORTED_PRODUCT.md,
    # docs/INSTALLATION.md): runs deploy/lib/os-matrix-check.sh — the real
    # detect_os() and install_dependencies_rhel()/install_dependencies_debian()
    # from deploy/almalinux/install.sh, unmodified — inside an official
    # container image for each RECOGNIZED/BEST-EFFORT and CI-TESTED
    # distribution, installing the real production package list via the
    # real dnf/apt against that distribution's real live repositories.
    # This is the check that would have caught certbot needing EPEL on
    # AlmaLinux/Rocky/RHEL 9 before it shipped.
    #
    # Explicitly NOT an end-to-end VPS install (L3/L4): most container
    # runtimes have no real init system or firewall/netfilter access, so
    # systemctl/firewall-cmd/ufw are stubbed inside the check script — see
    # its header comment. A green run here proves package names resolve
    # today; it does not prove firewalld/ufw activation, systemd units, or
    # SELinux behave correctly on a real host. AlmaLinux 9 stays the one
    # OS validated end-to-end with a real sing-box binary, via the
    # singbox-validate job below.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            expect_os_id: ubuntu
          - image: ubuntu:24.04
            expect_os_id: ubuntu
          - image: debian:12
            expect_os_id: debian
          - image: debian:13
            expect_os_id: debian
          - image: almalinux:9
            expect_os_id: almalinux
          - image: rockylinux:9
            expect_os_id: rocky
          - image: amazonlinux:2023
            expect_os_id: amzn
    steps:
      # actions/checkout needs git inside the container; the base images
      # above ship neither by default. Installed non-interactively before
      # checkout can run.
      # `shell: bash` is required, not cosmetic: GitHub Actions defaults
      # container-job `run:` steps to `sh`, and on Debian/Ubuntu images
      # `/bin/sh` is dash, which does not support `set -o pipefail` (RHEL-
      # family images happen to alias `/bin/sh` to bash, so they passed
      # here by luck before this was pinned explicitly) — caught by this
      # job's own first real run.
      - name: Install git (minimal container images ship neither by default)
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y >/dev/null
            apt-get install -y git >/dev/null
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git >/dev/null
          else
            echo "::error::no known package manager (apt-get/dnf) found in ${{ matrix.image }}"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: L1/L2 OS regression check (deploy/lib/os-matrix-check.sh)
        shell: bash
        env:
          EXPECT_OS_ID: ${{ matrix.expect_os_id }}
        run: bash deploy/lib/os-matrix-check.sh

  secret-logging-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash deploy/lib/check-no-secret-logging.sh

  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: test -s LICENSE

  singbox-validate:
    # Real-binary validation (docs/PRODUCTION_HARDENING_PLAN.md #11):
    # downloads the exact pinned sing-box release (never `latest`),
    # verifies it against upstream checksums when published (same logic
    # as deploy/almalinux/install.sh, not duplicated by hand so the two
    # can't silently drift), then renders a real server config via
    # `vpn-admin` and validates it with the actual `sing-box check`
    # binary — not just the injected-closure unit tests. Blocking: no
    # `|| true` anywhere in this job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # deploy/lib/versions.env is the single authoritative source for
      # SINGBOX_VERSION/SINGBOX_SHA256_AMD64/SINGBOX_SHA256_ARM64/
      # SUPPORTED_ARCH — install.sh and deploy/lib/fast-gate.sh read the
      # same file, so this job cannot silently drift from what a real
      # install actually pins.
      - name: Load pinned versions (deploy/lib/versions.env)
        run: grep -vE '^\s*(#|$)' deploy/lib/versions.env >> "$GITHUB_ENV"

      - name: Download pinned sing-box release
        run: |
          set -euo pipefail
          tarball="sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/${tarball}"
          curl -fsSL -o "$tarball" "$url"
          sums_url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box_${SINGBOX_VERSION}_checksums.txt"
          if curl -fsSL -o checksums.txt "$sums_url"; then
            sha256sum --ignore-missing -c checksums.txt
          else
            actual="$(sha256sum "$tarball" | awk '{print $1}')"
            if [ "$actual" != "$SINGBOX_SHA256_AMD64" ]; then
              echo "::error::sing-box checksum mismatch: expected $SINGBOX_SHA256_AMD64, got $actual"
              exit 1
            fi
            echo "verified against pinned expected SHA256 (no upstream checksums.txt for this release)."
          fi
          tar -xzf "$tarball"
          install -m 0755 "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Build vpn-admin
        run: cargo build --locked --release -p admin

      - name: Render + validate a real server config with the real binary
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/vpn-compat-test"
          mkdir -p "$STATE/hysteria"
          # sing-box check requires a syntactically valid cert/key pair to
          # exist at the configured paths even in a check-only run.
          openssl req -x509 -newkey ed25519 -days 1 -nodes \
            -keyout "$STATE/hysteria/key.pem" -out "$STATE/hysteria/cert.pem" \
            -subj "/CN=ci-test.example.com"

          cat > "$RUNNER_TEMP/deployment.toml" <<EOF
          public_host = "ci-test.example.com"
          subscription_host = "sub.ci-test.example.com"
          state_dir = "$STATE"
          singbox_binary = "/usr/local/bin/sing-box"

          [reality]
          listen_port = 443
          handshake_server = "www.google.com"

          [hysteria2]
          listen_port = 443

          [subscription]
          listen_port = 9100
          EOF

          BIN=./target/release/vpn-admin
          VPN1_ALLOW_OFFLINE_MUTATION=1 "$BIN" --config "$RUNNER_TEMP/deployment.toml" init
          VPN1_ALLOW_OFFLINE_MUTATION=1 "$BIN" --config "$RUNNER_TEMP/deployment.toml" user create --name ci-test-user
          "$BIN" --config "$RUNNER_TEMP/deployment.toml" render-config

          echo "running real sing-box check against the generated server config:"
          sing-box check -c "$STATE/sing-box/config.json"

      # A test that always skips is documentation, not regression
      # protection. This is the one job with the pinned, checksum-verified
      # binary on disk, so it is the one responsible for actually RUNNING
      # the interop suites for real.
      #
      # Two mechanical guarantees, because "CI stayed green" is NOT proof
      # the tests ran (it previously wasn't: the `test` job above runs the
      # same binaries with no sing-box and reports `ok` for every one of
      # them):
      #   1. VPN1_REQUIRE_REAL_INTEROP=1 turns every in-test skip into a
      #      hard panic, so a missing binary/openssl fails the job.
      #   2. The expected pass counts are asserted below, so a test that is
      #      deleted, renamed, or silently stops running fails the job too.
      - name: Real VLESS+REALITY and Hysteria2 interoperability tests (real sing-box)
        env:
          SING_BOX_BIN: /usr/local/bin/sing-box
          VPN1_REQUIRE_REAL_INTEROP: "1"
        run: |
          set -euo pipefail
          cargo test --locked -p compat-config \
            --test reality_interop --test reality_decoy_budget --test hysteria2_interop \
            -- --nocapture 2>&1 | tee interop.log

          # Assert the exact number of tests that actually executed.
          # Update this count deliberately when adding a test — never by
          # pasting whatever the log happened to print.
          #   3 reality_interop + 1 reality_decoy_budget + 5 hysteria2_interop
          #   (2 original + 2 added for salamander obfuscation coverage +
          #   1 added for the optional Brutal up_mbps/down_mbps config,
          #   validated against the real pinned binary via `sing-box check`)
          expected=9
          total_ok="$(grep -c "^test .* \.\.\. ok$" interop.log || true)"
          if [ "$total_ok" != "$expected" ]; then
            echo "::error::expected $expected real interop tests to run and pass, saw $total_ok"
            exit 1
          fi
          if grep -q "^skipping:" interop.log; then
            echo "::error::an interop test skipped despite VPN1_REQUIRE_REAL_INTEROP=1"
            exit 1
          fi
          echo "all $total_ok real-binary interop tests executed and passed"

      # The reality_interop.rs suite above proves crate-level config
      # RENDERING is protocol-correct; it never runs `vpn-admin` itself. This
      # step closes that gap: it runs the actual `vpn-admin doctor --protocol`
      # self-test — the one thing this repository's own audit docs
      # (docs/FINAL_PRODUCTION_AUDIT.md) said had never been exercised against
      # a real handshake in CI — against a real, live `sing-box` server AND a
      # real, live `subscription` process, both spawned directly (no systemd
      # unit in this runner, matching every other step in this job). A local
      # TLS 1.3 decoy is used for the same determinism reason
      # reality_decoy_budget.rs's doc comment gives for not dialing a
      # third-party CDN in a merge-gating test.
      #
      # This only asserts the L5-6 line is OK, not the whole command's exit
      # code: `doctor`'s file-ownership/group checks (L2) always fail on a
      # GitHub-hosted runner, which has no `sing-box`/`vpn-subscription`
      # system groups — that is a real, pre-existing environment gap in this
      # runner, not something this step is responsible for proving.
      - name: vpn-admin doctor --protocol against a real live sing-box + subscription process
        run: |
          set -euo pipefail
          cargo build --locked --release -p admin
          cargo build --locked --release -p subscription
          ADMIN=./target/release/vpn-admin
          SUB=./target/release/subscription
          STATE="$RUNNER_TEMP/vpn-protocol-selftest"
          mkdir -p "$STATE/hysteria"

          openssl req -x509 -newkey rsa:2048 -days 1 -nodes \
            -keyout "$RUNNER_TEMP/decoy-key.pem" -out "$RUNNER_TEMP/decoy-cert.pem" \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
          openssl s_server -accept 28997 -cert "$RUNNER_TEMP/decoy-cert.pem" \
            -key "$RUNNER_TEMP/decoy-key.pem" -tls1_3 -quiet -naccept 100 \
            > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/decoy.pid"

          openssl req -x509 -newkey ed25519 -days 1 -nodes \
            -keyout "$STATE/hysteria/key.pem" -out "$STATE/hysteria/cert.pem" \
            -subj "/CN=ci-test.example.com"

          cat > "$RUNNER_TEMP/protocol-selftest-deployment.toml" <<EOF
          public_host = "127.0.0.1"
          subscription_host = "127.0.0.1"
          state_dir = "$STATE"
          singbox_binary = "/usr/local/bin/sing-box"

          [reality]
          listen_port = 28445
          handshake_server = "localhost"
          handshake_port = 28997

          [hysteria2]
          listen_port = 28446

          [subscription]
          listen_port = 29101
          EOF

          CFG="$RUNNER_TEMP/protocol-selftest-deployment.toml"
          VPN1_ALLOW_OFFLINE_MUTATION=1 "$ADMIN" --config "$CFG" init
          VPN1_ALLOW_OFFLINE_MUTATION=1 "$ADMIN" --config "$CFG" user create --name ci-protocol-test
          "$ADMIN" --config "$CFG" render-config

          /usr/local/bin/sing-box run -c "$STATE/sing-box/config.json" > "$RUNNER_TEMP/singbox.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/singbox.pid"
          sleep 1
          "$SUB" --config "$CFG" > "$RUNNER_TEMP/subscription.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/subscription.pid"
          sleep 1

          set +e
          "$ADMIN" --config "$CFG" doctor --protocol > "$RUNNER_TEMP/doctor.log" 2>&1
          set -e
          cat "$RUNNER_TEMP/doctor.log"

          kill "$(cat "$RUNNER_TEMP/singbox.pid")" "$(cat "$RUNNER_TEMP/subscription.pid")" \
               "$(cat "$RUNNER_TEMP/decoy.pid")" 2>/dev/null || true

          if ! grep -q "^\[OK\]   \[L5-6\] protocol self-test:" "$RUNNER_TEMP/doctor.log"; then
            echo "::error::vpn-admin doctor --protocol did not report a real L5-6 handshake PASS against a live sing-box+subscription pair. See --- singbox.log/subscription.log below."
            echo "--- singbox.log ---"; cat "$RUNNER_TEMP/singbox.log"
            echo "--- subscription.log ---"; cat "$RUNNER_TEMP/subscription.log"
            exit 1
          fi
          echo "vpn-admin doctor --protocol proved a real REALITY handshake end-to-end."
