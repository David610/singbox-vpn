[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/crypto",
    "crates/config",
    "crates/network-state",
    "crates/transport-api",
    "crates/failure-classifier",
    "crates/policy",
    "crates/transport-native",
    "crates/rendezvous-client",
    "crates/telemetry",
    "apps/client-daemon",
    "apps/cli",
    "services/rendezvous",
    "services/relay-agent",
    "services/test-service",
    "tests",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bitflags = "2"
proptest = "1"
clap = { version = "4", features = ["derive"] }
