[workspace]
resolver = "2"
# This IS the production build -- there is no longer a separate
# default-members subset to maintain. The unsupported native/adaptive
# prototype (transport-native, rendezvous, relay-agent, client-daemon,
# and everything only they depended on) was removed from main; its full
# implementation is preserved on the `archive/native-adaptive-stack-2026`
# branch. See docs/SUPPORTED_PRODUCT.md.
members = [
    "crates/common",
    "crates/compat-config",
    "crates/provisioning-contract",
    "apps/admin",
    "services/subscription",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
proptest = "1"
clap = { version = "4", features = ["derive"] }
toml = "1.1"
