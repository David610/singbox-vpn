[package]
name = "transport-native"
version = "0.1.3"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
common = { path = "../common" }
network-state = { path = "../network-state" }
transport-api = { path = "../transport-api" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.13"
sha2 = "0.11"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# Test-only: constructs OffsetDateTime fixtures for cert.rs's validity-
# parsing tests. Already present in Cargo.lock (a transitive dependency
# of rcgen, which uses it for the same CertificateParams::not_before/
# not_after fields these tests set), so this adds a graph edge, not a
# new crate or version.
time = { version = "0.3", features = ["macros"] }
