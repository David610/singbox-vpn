[package]
name = "admin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vpn-admin"
path = "src/main.rs"

# Ergonomic end-user-facing alias for the same binary (spec: normal users
# should be able to type `vpn ...`, not `vpn-admin ...`). Same main.rs,
# same clap parser — `vpn-admin` keeps working unchanged for any existing
# script/doc that references it.
[[bin]]
name = "vpn"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
common = { path = "../../crates/common" }
compat-config = { path = "../../crates/compat-config" }
anyhow = "1"
qrcode = { version = "0.14", default-features = false }
tempfile = "3"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
